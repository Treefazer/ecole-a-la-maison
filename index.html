   "Je cherche le tout ou une partie ?\nLe tout → j'additionne les parties.\nUne partie → je soustrais.\nJe réponds par une phrase.",
   "Donne un problème avec « de plus que » qui se résout par une soustraction : le schéma doit l'empêcher d'additionner.",
   [["Elle additionne dès qu'elle lit « de plus ».","Toujours le schéma : qui est le plus grand ?"],["Pas de phrase réponse.","« Sans phrase, je ne sais pas de quoi tu parles ! »"]])],
 /* Maternelle */
 MCompte:[L(MATER,"Compter une collection","Dénombrer une collection : un mot-nombre par objet, sans en oublier ni en compter deux fois, et savoir que le dernier nombre dit combien il y en a.","Réciter la comptine des nombres jusqu'à 5 (MS) ou 10 (GS).","Coquillages, une boîte, un dé.",
   [["🎵 La comptine","Dire la comptine des nombres en jouant (« 1, 2, 3, nous irons au bois… »)."],["🤲 Déplacer","Elle compte en déplaçant chaque coquillage dans la boîte : un mot, un coquillage. Pour compter, on déplace !"],["❓ Combien ?","Après avoir compté : « Alors, combien y en a-t-il ? » Elle répond le dernier nombre (« 5 ») sans recompter. C'est le point le plus important."],["🎯 Seule","« Donne-moi 4 coquillages » : elle s'arrête au bon nombre."]],
   "","« Donne-moi 4 » (et non « compte ») : si elle s'arrête à 4, c'est acquis.",
   [["Elle récite plus vite qu'elle ne pointe.","Déplacer les objets un par un dans la boîte."],["À « combien ? », elle recompte.","Montre-lui : « 1, 2, 3, 4, 5… il y en a 5 ! »"]])],
 MDe:[L(MATER,"Reconnaître les petites quantités d'un coup d'œil","Reconnaître sans compter 1, 2, 3 (MS) puis jusqu'à 5 ou 6 (GS) : les points du dé, les doigts.","Aucun.","Dés, dominos, cartes à points, ses mains.",
   [["👀 Le flash","Montre une face de dé 2 secondes puis cache-la : « Combien ? » Pas le temps de compter : il faut voir."],["✋ Les doigts","Montrer 3 avec les doigts de plusieurs façons (2 et 1, ou 3 d'un coup)."],["🎲 Jouer","Les jeux de dé (petits chevaux, jeu de l'oie, Dobble) sont les meilleurs exercices."],["🎯 Seule","Elle montre très vite avec ses doigts le nombre de points du dé."]],
   "","Elle dit « 4 » pour la face du dé sans pointer avec le doigt.",
   [["Elle compte chaque point.","Normal au début : les jeux de dé quotidiens installent la reconnaissance."]])],
 MPlus:[L(MATER,"Comparer : plus, moins, autant","Dire où il y en a plus, moins ou autant, en faisant correspondre un à un.","Compter jusqu'à 5.","Assiettes et cuillères, coquillages de deux couleurs.",
   [["🤲 Mettre la table","4 assiettes, des cuillères : « Une cuillère par assiette. Il y en a assez ? Trop ? »"],["👀 Face à face","Deux rangées de coquillages alignées un en face d'un : ceux qui n'ont pas de partenaire montrent qui en a le plus."],["🗣️ Dire","Les mots : plus que, moins que, autant que."],["🎯 Seule","« Prends autant de coquillages que moi. »"]],
   "","Deux rangées de 5, l'une plus étalée : elle dit « autant », sans se laisser tromper par la longueur.",
   [["Pour elle, la rangée la plus longue en a le plus.","Aligner un à un."]])],
 MApres:[L(MATER,"La suite des nombres : et après ?","Dire le nombre qui vient après (et avant) un nombre donné, sans repartir de 1.","La comptine jusqu'à 10.","Un escalier, une file numérique, le jeu de l'oie.",
   [["🦶 L'escalier","Monter en comptant ; s'arrêter : « tu es sur 4. Et après ? »"],["🎲 Le jeu de l'oie","Avancer en comptant les cases à partir de la case suivante (pas celle où l'on est)."],["👀 La file","File numérique de 1 à 10 : cache un nombre, elle trouve lequel."],["🎯 Seule","« Compte à partir de 5. »"]],
   "","« Après 6 ? » sans repartir de 1.",
   [["Elle repart de 1.","Dis le nombre plus fort (« 5… ») et elle continue."]])],
 MFormes:[L(MATER,"Les formes : rond, carré, triangle, rectangle","Reconnaître et nommer les formes simples et les retrouver autour d'elle.","Aucun.","Formes découpées dans du carton, pâte à modeler, objets de la maison, un sac opaque.",
   [["✋ Le sac mystère","Une forme dans le sac : elle la touche sans regarder et devine. « Il y a des coins ? Combien ? »"],["🏠 La chasse","Trouver dans la maison des objets ronds, carrés, triangulaires."],["🎨 Fabriquer","Les formes en pâte à modeler ou en bâtonnets ; une maison avec un carré et un triangle."],["🎯 Seule","Elle nomme 4 formes et en dessine une."]],
   "","Un triangle « la tête en bas » reste un triangle pour elle.",
   [["Tout ce qui a des coins est un « carré ».","Compter les côtés : 3 → triangle."]])],
 MCouleurs:[L(MATER,"Les couleurs","Nommer les couleurs et trier des objets selon leur couleur.","Aucun.","Pinces à linge, légos, bols de couleur, peinture.",
   [["🤲 Trier","Elle range les objets dans le bol de la même couleur."],["🗣️ Nommer","« Apporte-moi quelque chose de jaune. »"],["🎨 Mélanger","Peinture : bleu + jaune = vert ; rouge + jaune = orange."],["🎯 Seule","Le jeu « je vois une couleur » dehors."]],
   "","Elle nomme 6 couleurs sans erreur.",
   [["Elle confond toujours deux couleurs.","Une couleur par jour ; si la confusion persiste, en parler au médecin (vision des couleurs)."]])],
 MSuite:[L(MATER,"Les suites qui se répètent","Repérer le motif qui se répète et continuer la suite (rouge-bleu-rouge-bleu…).","Couleurs, formes.","Perles, pâtes, légos, gommettes.",
   [["👀 Observer","Un collier rouge-bleu-rouge-bleu : « Qu'est-ce qui revient ? »"],["🗣️ En rythme","Elle dit la suite à voix haute en tapant dans les mains : rouge (clap), bleu (clap)…"],["🤲 Continuer","Elle continue le collier, puis un motif plus difficile (rouge-rouge-bleu)."],["🎯 Elle invente","Elle invente une suite pour toi."]],
   "","Elle continue une suite à 3 éléments et explique « ce qui revient ».",
   [["Elle enfile au hasard.","Relire la suite à voix haute, en rythme, avant chaque perle."]])],
 MTri:[L(MATER,"Trier et classer","Trier des objets selon un critère (couleur, forme, taille, sorte) et dire ce critère.","Couleurs, formes.","Jouets, boutons, coquillages, boîtes.",
   [["🤲 Trier","Une boîte pour les animaux, une pour les voitures… elle range."],["❓ Pourquoi ?","« Pourquoi celui-là ici ? » Elle dit le critère."],["🔄 Autrement","Les mêmes objets triés autrement : par couleur, puis par taille."],["🎯 Seule","Tu tries, elle devine ton critère."]],
   "","Elle trouve le critère que tu as choisi.",
   [["Elle change de critère en cours de route.","Une étiquette dessinée sur chaque boîte."]])]

 Son:[
  L(CP,"Apprendre un nouveau son","Associer une lettre (ou un groupe de lettres) à son son, l'entendre dans les mots, et lire des syllabes en fusionnant consonne et voyelle.","Les voyelles et les sons déjà étudiés (voir la progression CP de l'application).","Ardoise, lettres mobiles (ou papiers), images d'objets, une comptine du son.",
   [["👂 Entendre","5 mots : « lève la main si tu entends [m] : moto, sac, lune, ami, mur ». Les consonnes qui « chantent » s'allongent : mmmmoto."],
    ["👀 Voir","Montre la lettre dans ses écritures (m, M et en attaché) avec un mot repère et son image (m de moto). Elle la trace dans l'air, puis au doigt ✍️."],
    ["🔗 Fusionner","Lettres mobiles : m + a → « mmmmaaa » → ma. Fais glisser les lettres l'une vers l'autre pendant qu'elle allonge. Puis mi, mo, mu, am, om ; puis des mots : ami, lime, ma-mie."],
    ["📝 Écrire","Tu dictes ma, mo, puis ami : elle écrit sur l'ardoise. Lire et écrire s'apprennent ensemble."]],
   "Le son [m] s'écrit m.\nm + a → ma ; m + i → mi.\n(+ le mot repère avec un dessin)",
   "Elle lit 6 syllabes nouvelles sans deviner (mé, mur, rom…) et écrit 3 syllabes dictées.",
   [["Elle dit le nom de la lettre (« èm ») au lieu du son.","Toujours dire le son : mmm. Le nom des lettres sert pour l'alphabet, pas pour lire."],["Elle devine le mot à partir de la première lettre.","Cache l'image, découvre le mot lettre par lettre."],["Elle confond b et d, p et q.","Un mot repère avec un geste pour chacune, toujours le même."]]),
  L(CE1,"Les sons qui s'écrivent avec plusieurs lettres","Lire et écrire les sons qui s'écrivent avec plusieurs lettres (ou, on, an/en, in, oi, ch, gn, au/eau, ai, ill…) et choisir la bonne écriture.","Toutes les correspondances simples du CP.","Ardoise, cartes-graphies (o, au, eau…), un carnet des sons.",
   [["👂 Entendre","Le son [o] dans moto, chaud, bateau. « On entend le même son ? Oui. Mais regarde comment il s'écrit… »"],
    ["👀 Classer","Elle écrit les mots en colonnes : o | au | eau. Vous cherchez d'autres mots ensemble."],
    ["📝 Lire, écrire","Lecture de mots puis de phrases avec le son ; dictée de 5 mots. Pour écrire, elle cherche dans son carnet des sons la bonne écriture."],
    ["🎯 Mémoriser","Les mots fréquents (beau, chaud, aussi) vont dans les cartes flash ⚡."]],
   "Le son [o] peut s'écrire o (moto), au (chaud), eau (bateau).\neau est souvent à la fin des mots.",
   "Elle lit une phrase avec 3 mots contenant le son sans s'arrêter dessus.",
   [["Elle lit « a-u » séparément.","Entourer le groupe de lettres : il se lit d'un seul coup."],["Elle écrit le son « au hasard ».","Normal : l'orthographe se retient mot par mot. Valorise le son juste."]])],
 Ponct:[
  L(TOUS,"La phrase : majuscule et point","Savoir qu'une phrase commence par une majuscule, se termine par un point (. ? !) et a du sens.","Lire des phrases courtes.","Un texte court recopié sans ponctuation, des crayons de couleur.",
   [["👂 Écouter","Lis un texte d'un trait, sans pause, puis normalement. « Qu'est-ce qui change ? » Le point, c'est la pause où l'on respire."],
    ["👀 Repérer","Dans un livre, elle colorie en vert les majuscules de début de phrase et en rouge les points. Combien de phrases ?"],
    ["📝 Écrire","Texte sans ponctuation : elle remet majuscules et points. Puis le point d'interrogation (la voix monte) et le point d'exclamation (on s'exclame)."],
    ["🎯 Seule","Elle écrit 2 phrases sur sa journée et vérifie majuscule et point."]],
   "Une phrase commence par une majuscule et finit par un point.\n? pour une question. ! pour s'exclamer.",
   "Elle relit à voix haute en marquant les pauses : si elle respire aux points, c'est compris.",
   [["Elle met un point à chaque fin de ligne.","Une phrase peut continuer à la ligne : on cherche ce qui a un sens complet."]])],
 Types:[
  L(TOUS,"Les types de phrases","Reconnaître et écrire une phrase qui raconte (.), qui pose une question (?), qui s'exclame (!) ou qui donne un ordre.","Majuscule et point.","Cartes-phrases, un jeu de rôle.",
   [["🗣️ Jouer","Au marché : elle pose une question, tu réponds, elle donne un ordre (« Donne-moi deux bananes. »)."],
    ["👀 Trier","Des cartes-phrases à trier en 4 tas, d'après la ponctuation et l'intonation."],
    ["📝 Transformer","« Tu ranges ta chambre. » → question : « Est-ce que tu ranges ta chambre ? » → ordre : « Range ta chambre. »"],
    ["🎯 Seule","Elle écrit une phrase de chaque type sur le même sujet."]],
   "Phrase qui raconte : .\nQuestion : ?\nExclamation : !\nOrdre : . ou !",
   "Lis une phrase avec l'intonation : elle trouve son type à l'oreille.",
   [["La question écrite n'en est pas une (« Tu ranges ta chambre ? »).","À l'écrit, « Est-ce que… » est le plus simple."]])],
 Nom:[
  L(TOUS,"Le nom et le déterminant","Reconnaître un nom (personne, animal, chose) et le petit mot qui l'accompagne : le, la, les, un, une, des.","Lire des phrases simples.","Objets de la maison, étiquettes.",
   [["🤲 Nommer","Elle colle des étiquettes sur les objets : « la table », « un livre ». Ce sont des noms : on peut les montrer ou les dessiner."],
    ["👀 Le petit mot","Devant le nom, il y a souvent un petit mot : le déterminant. Tu dis un nom, elle ajoute le déterminant (une chaise, le chat)."],
    ["📝 Repérer","Dans des phrases, elle souligne les noms en bleu et entoure les déterminants. Les noms propres (Mahé, Nuku Hiva) ont une majuscule."],
    ["🎯 Seule","Elle trouve 5 noms dans une page de son livre."]],
   "Un nom désigne une personne, un animal ou une chose.\nLe déterminant est devant : le, la, les, un, une, des.\nUn nom propre commence par une majuscule.",
   "Le test « je peux mettre le ou un devant ? » : elle doit savoir l'utiliser seule.",
   [["Elle souligne un verbe ou un adjectif.","Test du déterminant : « un mange », ça ne marche pas."]])],
 Genre:[
  L(TOUS,"Masculin, féminin : les accords","Savoir qu'un nom est masculin (un, le) ou féminin (une, la) et que les mots qui l'accompagnent s'accordent avec lui.","Nom et déterminant.","Étiquettes de mots, deux boîtes « un » et « une ».",
   [["🤲 Trier","Elle range des étiquettes de noms dans la boîte « un » ou « une »."],
    ["👀 Observer","un chat noir / une chatte noire ; un ami gentil / une amie gentille. « Qu'est-ce qui change à l'écrit ? » Souvent un e à la fin."],
    ["📝 Accorder","Elle met des groupes au féminin, puis au pluriel : la petite fille → les petites filles."],
    ["🎯 Seule","Elle corrige 4 groupes de mots mal accordés."]],
   "Le nom commande : le déterminant et l'adjectif s'accordent avec lui.\nAu féminin, on ajoute souvent un e.",
   "« une grande maison » au pluriel : « des grandes maisons », les trois mots accordés.",
   [["Elle n'accorde que le nom.","Des flèches du nom vers les mots qui l'accompagnent."]])],
 Adj:[
  L(TOUS,"L'adjectif","Reconnaître l'adjectif, le mot qui dit comment est le nom, et l'accorder.","Nom et déterminant.","Objets, le jeu du portrait.",
   [["🗣️ Décrire","Le portrait : elle décrit un objet caché (« il est rond, rouge, petit »), tu devines. Ces mots sont des adjectifs."],
    ["👀 Enrichir","« Le chat dort. » → elle ajoute des adjectifs : « Le gros chat gris dort. »"],
    ["📝 Repérer et accorder","Elle souligne les adjectifs, puis accorde : une robe vert → verte."],
    ["🎯 Seule","Elle décrit sa peluche avec 3 adjectifs écrits."]],
   "L'adjectif dit comment est le nom.\nIl s'accorde avec le nom : une robe verte, des robes vertes.",
   "« Comment est la mer aujourd'hui ? » : réponse avec un adjectif bien accordé.",
   [["Elle confond adjectif et nom.","Test : on peut dire « très » devant un adjectif (très rouge), pas devant un nom."]])],
 Pluriel:[
  L(TOUS,"Le singulier et le pluriel","Savoir que « un seul » c'est le singulier, « plusieurs » le pluriel, et qu'au pluriel on ajoute souvent un s (parfois un x) qu'on n'entend pas.","Nom et déterminant.","Objets en un ou plusieurs exemplaires, étiquettes, ardoise.",
   [["🤲 Montrer","Un coquillage / des coquillages. « On entend la différence ? » Seulement dans le petit mot (un / des)."],
    ["👀 Observer","À l'écrit : le chat / les chats. Le s ne s'entend pas : c'est une lettre muette qui dit « plusieurs »."],
    ["📝 Les mots-signaux","les, des, deux, trois… annoncent le pluriel. Puis les mots en -eau et -eu prennent un x : des bateaux."],
    ["🎯 Seule","Dictée de 5 groupes : elle repère d'abord le mot-signal, puis met le s."]],
   "Singulier : un seul. Pluriel : plusieurs.\nAu pluriel, on ajoute souvent un s : un chat, des chats.\n-eau → x : des bateaux.",
   "Dans une dictée, le s du pluriel apparaît sans que tu le rappelles.",
   [["Elle écrit « les » mais oublie le s du nom.","Flèche du déterminant vers le nom : « les dit plusieurs, alors le nom aussi »."]])],
 Pronoms:[
  L(TOUS,"Les pronoms : il, elle, ils, elles","Comprendre qu'un pronom remplace un nom pour éviter de le répéter, et retrouver qui il désigne.","Le nom.","Des peluches, une histoire courte.",
   [["🤲 Jouer","Avec des peluches : « Le lapin saute. Il saute. » Qui est « il » ? Elle montre la peluche."],
    ["👀 Remplacer","Elle remplace un nom par il, elle, ils ou elles : « Les filles jouent » → « Elles jouent »."],
    ["📝 Relier","Dans un texte, une flèche de chaque pronom vers le nom qu'il remplace."],
    ["🎯 Seule","Elle réécrit une petite histoire où un nom est trop répété."]],
   "je, tu, il, elle, nous, vous, ils, elles sont des pronoms.\nil, elle, ils, elles remplacent un nom pour ne pas le répéter.",
   "Dans une histoire : « Qui est-ce, elle ? » : elle retrouve le personnage.",
   [["Elle confond il et ils à l'écrit.","ils = plusieurs : le s comme au pluriel."]])],
 Remets:[
  L(TOUS,"Construire une phrase","Remettre des mots dans l'ordre pour faire une phrase qui a du sens, avec majuscule et point.","Lire les mots.","Étiquettes-mots découpées.",
   [["🤲 Les étiquettes","Phrase découpée : « Le chat mange la souris. » Elle la reconstruit. Puis : « La souris mange le chat » — ça ne veut plus du tout dire la même chose !"],
    ["👀 Les indices","Le mot qui a la majuscule va au début, celui qui a le point à la fin."],
    ["📝 Écrire","Elle recopie la phrase reconstruite."],
    ["🎯 Seule","Elle te prépare une phrase en étiquettes à reconstruire."]],
   "Une phrase est une suite de mots rangés dans un ordre qui a du sens.\nMajuscule au début, point à la fin.",
   "Elle lit sa phrase à voix haute et dit si elle a du sens.",
   [["Sa phrase n'a pas de sens.","La lire à voix haute : « est-ce que ça se dit ? »"]])],
 Verbe:[
  L(TOUS,"Le verbe","Repérer le verbe : il dit ce que fait le sujet (ou ce qu'il est), et il change quand on dit hier, aujourd'hui, demain.","La phrase.","Cartes-actions pour un jeu de mime.",
   [["🤲 Mimer","Elle tire une carte (nager, courir, manger) et la mime. Ces mots d'action sont des verbes."],
    ["👀 Le test du temps","« Aujourd'hui, Mahé nage. Hier, Mahé nageait. Demain, Mahé nagera. » Le mot qui change, c'est le verbe."],
    ["📝 L'infinitif","Le nom du verbe : « il mange » → manger. Elle souligne le verbe en rouge dans des phrases."],
    ["🎯 Seule","Elle trouve le verbe de 4 phrases avec le test hier / demain."]],
   "Le verbe dit ce que fait le sujet.\nIl change quand je dis hier, aujourd'hui, demain.\nSon nom, c'est l'infinitif : manger, finir, être.",
   "« Le ciel est bleu. » (pas d'action) : elle trouve « est » avec le test du temps.",
   [["Elle souligne le nom d'une action (« la course »).","Test : « je … » : je cours, pas « je course »."]])],
 Conjugue:[
  L([-2,1],"Conjuguer au présent : être, avoir et les verbes en -er","Associer chaque pronom à la bonne forme du verbe au présent et repérer les terminaisons des verbes en -er.","Pronoms, verbe.","Un dé, des cartes-verbes.",
   [["🎲 Le dé","Chaque face = un pronom (1 je, 2 tu, 3 il/elle, 4 nous, 5 vous, 6 ils/elles). Elle lance et conjugue à l'oral : « vous… chantez ! »"],
    ["👀 Observer","Écris « jouer » au présent en colonne ; elle entoure ce qui change : e, es, e, ons, ez, ent. « À l'oral, je joue, tu joues, il joue, ils jouent, c'est pareil ! Pas à l'écrit. »"],
    ["📝 Écrire","Être et avoir s'apprennent par cœur (en chantant). Puis 3 verbes en -er à conjuguer."],
    ["🎯 Seule","Elle écrit 4 phrases au présent sur ce qu'elle fait aujourd'hui."]],
   "Verbes en -er : je joue, tu joues, il joue, nous jouons, vous jouez, ils jouent.\nêtre : je suis, tu es, il est, nous sommes, vous êtes, ils sont.\navoir : j'ai, tu as, il a, nous avons, vous avez, ils ont.",
   "« ils chant… » : elle écrit -ent sans qu'on le dise.",
   [["Elle prononce le -ent.","Le -ent est muet : c'est une marque écrite du pluriel."],["« tu chante » sans s.","Avec tu, le verbe finit presque toujours par s."]]),
  L([2,3],"Passé, présent, futur","Situer une action dans le temps et conjuguer les verbes fréquents au futur, à l'imparfait et au passé composé.","Le présent des verbes en -er, être, avoir.","Une frise hier / aujourd'hui / demain, des cartes-verbes.",
   [["🤲 La frise","Elle place des étiquettes sur la frise : « je nageais », « je nage », « je nagerai »."],
    ["👀 Observer","Futur : on entend « r » (je chanterai, tu chanteras). Imparfait : -ais, -ait, -aient. Passé composé : deux mots, avoir ou être + le verbe (j'ai chanté, je suis allée)."],
    ["📝 Écrire","Un verbe en -er aux trois temps, puis être et avoir."],
    ["🎯 Seule","Elle raconte au passé composé ce qu'elle a fait hier, puis au futur ce qu'elle fera demain."]],
   "Futur : je chanterai, tu chanteras, il chantera.\nImparfait : je chantais, il chantait, ils chantaient.\nPassé composé : j'ai chanté, je suis allée.",
   "« Demain, nous … (aller) » : elle trouve « irons ».",
   [["Elle oublie le petit mot du passé composé (« je chanté »).","Le passé composé est « composé » de deux mots."]])],
 Muettes:[
  L(TOUS,"Les lettres muettes","Savoir que certaines lettres finales ne s'entendent pas et trouver la lettre muette grâce à un mot de la même famille.","Lire des mots.","Ardoise, cartes-mots.",
   [["👂 Observer","Écris « petit » : elle lit. « Le t, on l'entend ? » Non. « Et dans petite ? » Oui !"],
    ["👀 L'astuce","Pour trouver la lettre muette, on cherche le féminin ou un mot de la famille : grand → grande, chant → chanter, lait → laitier."],
    ["📝 Écrire","Elle complète : un gran… bateau (d)."],
    ["🎯 Seule","Les mots appris vont dans les cartes flash ⚡."]],
   "Certaines lettres ne s'entendent pas.\nPour les trouver, je cherche un mot de la même famille : petit → petite.",
   "« Comment sais-tu qu'il y a un t à chat ? » → chaton.",
   [["Elle ajoute des lettres muettes partout.","Seulement si un mot de la famille le prouve ; sinon, le mot s'apprend par cœur."]])],
 Alpha:[
  L(TOUS,"L'ordre alphabétique et le dictionnaire","Réciter l'alphabet, ranger des mots par ordre alphabétique (1re puis 2e lettre) et chercher un mot dans le dictionnaire.","Connaître les lettres.","Un dictionnaire, des cartes-lettres et cartes-mots.",
   [["🎵 Réciter","La chanson de l'alphabet, puis à partir d'une lettre au hasard (« de K à P »)."],
    ["🤲 Ranger","Des cartes-lettres en ligne, puis des cartes-mots selon la première lettre. Si elle est pareille, on regarde la deuxième (balle, bateau)."],
    ["📝 Le dictionnaire","Il est rangé dans cet ordre. Coupé en 3 : A à F au début, G à P au milieu, Q à Z à la fin. Elle cherche « poisson »."],
    ["🎯 Seule","Elle cherche 3 mots et lit leur définition."]],
   "a b c d e f g h i j k l m n o p q r s t u v w x y z\nSi la 1re lettre est la même, je regarde la 2e.",
   "Ranger chat, cheval, ciel : elle explique pourquoi ciel vient après.",

const METHODE_LECON=`<ol class="lec-meth-l">
<li><b>Rappel (2 min)</b> : on redit ce qu'on a appris la dernière fois.</li>
<li><b>Je montre</b> : tu fais devant elle en pensant à voix haute (« je regarde d'abord les dizaines… »).</li>
<li><b>On fait ensemble</b> : avec les objets, puis le dessin. Elle manipule, tu guides par des questions plutôt que par des réponses.</li>
<li><b>Elle fait seule</b> : 2 ou 3 exemples. Ne corrige pas tout de suite : « Tu es sûre ? Vérifie. »</li>
<li><b>On retient</b> : la phrase « À retenir », écrite ou collée dans son cahier.</li>
<li><b>Elle explique</b> : elle t'explique comme si c'était toi l'élève. Si elle sait l'expliquer, elle a compris.</li></ol>
<p><b>Objets → dessin → écrit</b> : on passe à l'étape suivante seulement quand la précédente est facile. Si elle bloque à l'écrit, on revient aux objets : ce n'est pas un recul.</p>
<p><b>10 à 15 minutes</b>, pas plus, et toujours finir sur une réussite. Si elle se braque : on arrête, on passe à un jeu, on reprendra demain. Rien n'est perdu.</p>`;

const aLecon=(m,k)=>!!(LECONS[m]&&LECONS[m][k]);
function leconPour(m,k,lvl){const V=LECONS[m]&&LECONS[m][k];if(!V)return null;
  return V.find(v=>lvl>=v.n[0]&&lvl<=v.n[1])||V.slice().sort((a,b)=>Math.min(Math.abs(lvl-a.n[0]),Math.abs(lvl-a.n[1]))-Math.min(Math.abs(lvl-b.n[0]),Math.abs(lvl-b.n[1])))[0];}
const nomVariante=v=>v.n[1]<=-3?"maternelle":v.n[1]<=0?"CP":v.n[0]>=1?(v.n[0]===v.n[1]?NOM_NIV[v.n[0]]:"CE1"):"CP et CE1";
const lecDire=s=>esc(s).replace(/«([^»]+)»/g,'<q class="lecq">«$1»</q>');
function traceHtml(v){if(!v.ret)return "";const st=REG.ecr==="lie"?"lie":REG.ecr==="maj"?"maj":"script";
  const lignes=v.ret.split("\n").map(x=>esc(st==="maj"?x.toUpperCase():x));
  return `<div class="lec-trace"><p class="lec-tt">📝 À retenir <small>(à recopier ou coller dans son cahier)</small></p><div class="ecr-ex ecr-${st}">${lignes.map(x=>`<p>${x}</p>`).join("")}</div></div>`;}
function leconHtml(m,k,lvl,imp){const v=leconPour(m,k,lvl);if(!v)return "";
  let h=`<div class="lec">${imp?`<h2>📘 ${esc(NOMK[m][k])}</h2>`:""}<p class="lec-niv">${m==="maths"?"🔢 Maths":"📖 Français"} · leçon ${nomVariante(v)}</p><h3 class="lec-t">${esc(v.t)}</h3>
  <p class="lec-obj">🎯 <b>Ce qu'elle doit apprendre</b> : ${esc(v.obj)}</p>
  <div class="lec-pm"><p>🧩 <b>Elle doit déjà savoir</b> : ${esc(v.pre)}</p><p>🧺 <b>Matériel</b> : ${esc(v.mat)}</p></div>
  <h4>Le déroulé <small>(10 à 15 min)</small></h4><ol class="lec-d">${v.d.map(([e,x])=>`<li><b>${esc(e)}</b><span>${lecDire(x)}</span></li>`).join("")}</ol>
  ${traceHtml(v)}
  <h4>✅ Vérifier qu'elle a compris</h4><p>${lecDire(v.verif)}</p>
  <h4>⚠️ Erreurs fréquentes</h4><ul class="lec-err">${v.err.map(([e,r])=>`<li><b>${esc(e)}</b> → ${lecDire(r)}</li>`).join("")}</ul>`;
  if(!imp){const jeu=JEUX[m]&&JEUX[m][k]?JEUX[m][k](lvl):"";
    if(jeu)h+=`<details><summary>🎲 Ensuite, s'entraîner en jouant</summary><div class="panneau">${jeu}</div></details>`;
    h+=`<details class="lec-meth"><summary>👤 Comment mener une leçon</summary>${METHODE_LECON}</details>`;}
  return h+`</div>`;}
let LEC_CTX=null;
function ouvrirLecon(m,k,lvl,ctx){
  if(lvl===undefined||lvl===null||isNaN(lvl))lvl=niveauDepart(k,niveau,m).lvl;

    const nv=b.items.find(it=>aLecon(it.m,it.key)&&["nv","ret"].includes(statutNotion(it.m,it.key)));
    if(nv&&!(STORE.jours[c]&&STORE.jours[c].fait&&STORE.jours[c].fait[b.id])&&!el.querySelector(".lecdj")){const bact=el.querySelector(".bact");
      const s=statutNotion(nv.m,nv.key);
      if(bact)bact.insertAdjacentHTML("beforebegin",`<p class="lecdj">📘 <b>Leçon du jour</b> : « ${esc(NOMK[nv.m][nv.key])} » ${s==="ret"?"lui a posé problème":"est nouvelle"}. Avant de lancer, 10 min de leçon avec des objets. <button class="o-btn lec" data-lecon="${nv.m}|${nv.key}|${nv.lvl}|">Ouvrir la leçon</button></p>`);}});};})();

majBoutons();afficherIntro();generer();setOnglet("jour");verifJournee(true);etatSync("appareil");majCompteur();brancherStockage();majBarreVisible();setTimeout(verifRetourJeu,800);if(syncActif()){syncEtat(SYNC.etat||'🔄 Synchronisation…',SYNC.ok);setTimeout(synchroniser,600);}
