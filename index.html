<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4D64">
<meta name="description" content="Séances guidées CP-CE1, programme de la journée et de la semaine, suivi des progrès.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="École">
<title>École à la maison</title>
<style>
:root{--lagon:#2BB3A8;--ocean:#0E4D64;--ocean-f:#062F3D;--corail:#B5402C;--corail-c:#FF6F59;--sable:#F7E6B8;--papier:#fff;--palme:#2E7D4A}
*{box-sizing:border-box}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Verdana,system-ui,sans-serif;background:var(--sable);color:var(--ocean)}
.barre{background:var(--ocean);padding:12px 12px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.barre h1{margin:0 0 10px;text-align:center;color:#fff;font-size:1.3rem}
.groupe{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.groupe button{flex:1;max-width:140px;background:#fff;color:var(--ocean);box-shadow:0 3px 0 #9FB8C2}
.groupe button[aria-pressed="true"]{background:var(--lagon);color:var(--ocean-f);box-shadow:0 3px 0 #1C7F77}
.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:10px 12px;font-size:.95rem;cursor:pointer;background:var(--corail);color:#fff;box-shadow:0 3px 0 #7E2A1C}
button:active{transform:translateY(2px)}
button:disabled{opacity:.4;cursor:default;transform:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--corail-c);outline-offset:2px}
.actions .corr{background:var(--palme);box-shadow:0 3px 0 #1D5531}
.reglage{color:#fff;font-size:.85rem;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin-top:6px}
.fiche{background:var(--papier);max-width:800px;margin:16px auto;padding:22px 20px 30px;border-radius:6px;box-shadow:0 2px 10px rgba(14,77,100,.15)}
.entete{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:3px solid var(--ocean);padding-bottom:10px;margin-bottom:6px}
.entete h2{margin:0;font-size:1.3rem}
body.corrige .entete h2::after{content:" – Corrigé";color:var(--corail)}
.exo{margin-top:20px;break-inside:avoid}
.exo h3{margin:0 0 8px;font-size:1.1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.exo h3 .num{background:var(--ocean);color:#fff;border-radius:50%;width:1.6em;height:1.6em;display:inline-grid;place-items:center;font-size:.9rem;flex:none}
.badge{font-size:.75rem;background:var(--palme);color:#fff;border-radius:8px;padding:2px 8px;white-space:nowrap}
.outils{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.o-btn{background:var(--sable);color:var(--ocean);box-shadow:0 2px 0 #D8C38A;font-size:.85rem;padding:6px 10px;border-radius:10px}
.o-btn.facile{background:#E3F4E8;box-shadow:0 2px 0 #A9D3B5}
.o-btn.dur{background:#E6EEF8;box-shadow:0 2px 0 #AFC3DB}
.panneau{margin:0 0 10px;background:#FFF7E2;border:2px dashed var(--corail);border-radius:12px;padding:10px 14px;font-size:1rem;line-height:1.45}
.panneau[hidden]{display:none}
.panneau p{margin:6px 0}
.panneau .mat{font-size:.9rem;opacity:.85}
.web{border-color:var(--lagon);background:#EEF9F8}
.web ul{margin:4px 0 8px;padding-left:20px}
.web li{margin:4px 0}
.web a{color:var(--ocean);font-weight:700}
.note{font-size:.95rem;margin:0 0 8px;background:#F4F9EC;border-left:4px solid var(--palme);padding:6px 10px}
.texte{background:#F1FAF9;border-left:4px solid var(--lagon);padding:8px 12px;margin:0 0 10px;font-size:1.15rem;line-height:1.7}
.texte sup.cpt{font-size:.65rem;color:var(--corail);font-weight:800;margin-left:2px}
.items{list-style:none;padding:0;margin:0;display:grid;gap:12px 18px;font-size:1.1rem;line-height:1.5}
.items.c2{grid-template-columns:1fr 1fr}
.blank{display:inline-block;min-width:70px;border-bottom:2px dotted var(--ocean);margin-left:4px}
.items.long .blank{display:block;min-width:0;width:70%;margin:14px 0 0;height:1.2em}
.items.pb .blank{height:4.5em;width:100%;border:2px dotted var(--ocean);border-radius:8px}
.rep{display:none;color:var(--corail);font-weight:800;margin-left:4px}
body.corrige .rep,.exo.montre .rep{display:inline}
body.corrige .blank,.exo.montre .blank{display:none}
small{font-size:.8em;opacity:.85}
.pts{letter-spacing:2px;white-space:nowrap}
.piece{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;border:2px solid #B08A2E;background:#F5D77A;font-size:.6em;font-weight:800;margin:1px;color:#5A4410}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:800;line-height:1.05;margin:0 3px}
.frac span:last-child{border-top:2px solid currentColor;padding:0 3px}
.bande{display:inline-flex;vertical-align:middle;border:2px solid var(--ocean)}
.bande i{width:22px;height:22px;border-right:2px solid var(--ocean)}
.bande i:last-child{border-right:none}
.bande i.on{background:var(--lagon)}
.trait{display:inline-block;height:8px;background:var(--ocean);border-radius:4px;vertical-align:middle;margin:6px}
.horloge{vertical-align:middle;color:var(--ocean)}
table.tab{border-collapse:collapse;margin:6px 0}
table.tab th,table.tab td{border:2px solid var(--ocean);padding:4px 10px;text-align:center}
dialog#viewer{width:min(1100px,96vw);height:92vh;padding:0;border:none;border-radius:12px;overflow:hidden}
dialog#viewer::backdrop{background:rgba(6,47,61,.6)}
.vhead{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--ocean);color:#fff;flex-wrap:wrap}
.vhead b{flex:1;min-width:150px}
.vhead a{color:#fff;font-weight:800;background:var(--lagon);color:var(--ocean-f);padding:8px 12px;border-radius:10px;text-decoration:none}
.vnote{margin:0;padding:6px 10px;font-size:.85rem;background:#FFF7E2}
#vframe{width:100%;height:calc(100% - 90px);border:0;background:#fff}
.grille,.fig{vertical-align:middle;color:var(--ocean);max-width:100%;height:auto}
.droite{width:100%;max-width:340px;height:auto;color:var(--ocean)}
.seg{display:inline-block;height:6px;background:var(--ocean);vertical-align:middle;border-left:2px solid var(--ocean);border-right:2px solid var(--ocean)}
.items.ecrit .blank{display:block;width:100%;height:9em;border:none;margin-top:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 1.75em,#9FB8C2 1.75em,#9FB8C2 calc(1.75em + 1px))}
.hors{margin-top:28px;border-top:3px dashed var(--palme);padding-top:12px}
.hors h3{margin:0 0 6px}
.hors li{margin:6px 0;line-height:1.4}
table.couv{border-collapse:collapse;width:100%;font-size:.95rem}
table.couv td{border-bottom:1px solid #D6E4E6;padding:6px 4px;vertical-align:top}
dialog#prog{width:min(720px,94vw);max-height:88vh;border:none;border-radius:12px;padding:16px 18px}
dialog#prog::backdrop{background:rgba(6,47,61,.6)}
.o-btn.cache{background:#eee;box-shadow:0 2px 0 #ccc}
[hidden]{display:none!important}
.titreb{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.titreb h1{margin:0}
.compteur{background:#FFF3D6;color:var(--ocean-f);border-radius:20px;padding:4px 12px;font-weight:800;font-size:1.05rem}
.sync{margin:6px 0 0;text-align:center;color:#CFE6EA;font-size:.8rem}
.onglets{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.onglets button{flex:1;max-width:200px;background:#1C5F74;color:#fff;box-shadow:none;border:2px solid #5FA3B2;padding:9px 6px}
.onglets button[aria-selected="true"]{background:#fff;color:var(--ocean);border-color:#fff}
.actions.second{margin-top:8px}
button.clair{background:#1C5F74;box-shadow:0 3px 0 #04252F;font-size:.85rem;padding:8px 10px}
button.gros{font-size:1.2rem;padding:14px 20px}
.intro{max-width:800px;margin:12px auto 0;background:#FFF7E2;border:2px solid var(--corail-c);border-radius:12px;padding:10px 16px;line-height:1.5;color:var(--ocean)}
.badge.bleu{background:var(--ocean)}
.badge.clair{background:#E6EEF8;color:var(--ocean)}
.etape{margin:0 0 4px;font-weight:800;color:var(--palme);font-size:.95rem}
.o-btn.aide{background:#EDE6F7;box-shadow:0 2px 0 #C9B9E3}
.guide{border-color:#8E6CC4;background:#F7F3FC}
.bilan{margin-top:14px;padding-top:10px;border-top:1px dashed #C7DADD}
.bilan .bq{margin:0 0 6px;font-weight:700}
.ech{display:flex;flex-wrap:wrap;gap:6px}
.ech .res{font-size:.85rem}
.res[aria-pressed="true"]{background:var(--ocean);color:#fff;box-shadow:none}
.retour{margin-top:8px;background:#F4F9EC;border-radius:10px;padding:8px 12px;line-height:1.45}
.retour p{margin:6px 0}
.score{margin-top:10px}.score input{width:5em;font:inherit;padding:4px;border:2px solid var(--ocean);border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(560px,94vw);background:var(--ocean);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;line-height:1.45}
.toast .tact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.toast button{background:#fff;color:var(--ocean);box-shadow:none;font-size:.85rem;padding:7px 10px}
.toast .tx{background:var(--lagon)}
.sesbar{position:fixed;left:0;right:0;bottom:0;background:var(--ocean-f);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:15;flex-wrap:wrap;font-weight:700}
.sesbar button{font-size:.8rem;padding:6px 10px;background:#1C5F74;box-shadow:none}
.sprog{flex:1;min-width:80px;height:10px;background:#D6E4E6;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
.sesbar .sprog{background:#2D5866}
.sprog i{display:block;height:100%;background:var(--lagon);width:0}
.sprog i.orange{background:#E0A030}.sprog i.rouge{background:var(--corail)}
.sprog.large{width:100%;height:14px;border-radius:7px}
.jprog .sprog{max-width:220px;margin-left:8px}
body.enseance{padding-bottom:64px}
.programmer{background:#EEF9F8;border:2px solid var(--lagon);border-radius:14px;padding:14px;text-align:center;margin:10px 0}
.programmer p{margin:10px 0 0;line-height:1.45}
.guidage{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#EEF9F8;border-radius:12px;padding:8px 12px;margin:10px 0}
.guidage span{flex:1;min-width:200px}
.jour{display:grid;gap:10px;margin-top:10px}
.bloc{display:flex;gap:12px;border:2px solid #C7DADD;border-radius:12px;padding:10px 12px;background:#fff}
.bloc .heure{width:76px;flex:none;font-weight:800;display:flex;flex-direction:column;gap:2px}
.bloc .heure small{font-weight:600;opacity:.75}
.bloc .corps{min-width:0}
.bloc .corps p{margin:4px 0 8px;line-height:1.45}
.bloc .bact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bloc .bact button{font-size:.85rem;padding:7px 10px}
.bloc .mini{display:flex;gap:4px}.bloc .mini button{padding:6px 8px}
.bloc.pause{background:#F6F2E6;border-style:dashed}
.bloc.fait{background:#EAF6EE;border-color:#9ACBA9}
.bloc.fait .corps>b{text-decoration:line-through;opacity:.7}
.bloc.maintenant{border-color:var(--corail);box-shadow:0 0 0 3px #FFD8CF}
.maint{background:var(--corail);color:#fff;border-radius:6px;font-size:.7rem;padding:1px 5px;width:max-content}
ol.sous{margin:0 0 8px;padding-left:20px;font-size:.92rem;line-height:1.5}
.sh{font-weight:800;color:var(--palme)}
.coche{font-weight:700}
.jopts select,.jopts input{font:inherit}
dialog#boite{width:min(760px,94vw);max-height:88vh;border:none;border-radius:12px;padding:16px 18px;line-height:1.45;color:var(--ocean);background:#fff}
dialog#boite::backdrop{background:rgba(6,47,61,.6)}
dialog#boite textarea,dialog#boite input:not([type=checkbox]){font:inherit;width:100%;max-width:520px;border:2px solid #C7DADD;border-radius:8px;padding:6px}
.defile{overflow-x:auto}
th{text-align:left;padding:6px 4px;border-bottom:2px solid var(--ocean)}
td.nw{white-space:nowrap}
/* Récompenses */
.fete{position:fixed;inset:0;z-index:30;background:rgba(6,47,61,.55);display:grid;place-items:center;padding:16px;overflow:hidden}
.fcarte{position:relative;background:#fff;border-radius:22px;padding:22px 20px;max-width:430px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.35);color:var(--ocean);animation:pop .45s ease}
.fbig{font-size:3rem;font-weight:900;color:var(--corail)}
.fmsg{font-size:1.25rem;font-weight:800;margin:6px 0 10px}
.fnouv{display:flex;align-items:center;gap:10px;background:#EEF9F8;border-radius:14px;padding:8px 12px;margin:8px 0;text-align:left}
.fanim{font-size:2.4rem}
.fprog{margin:10px 0}
.fact{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.confettis span{position:absolute;top:-40px;font-size:1.6rem;animation:tombe 2.2s ease-in forwards}
@keyframes tombe{to{transform:translateY(110vh) rotate(260deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.chemin{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:10px 0 4px}
.pas{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:3px solid var(--lagon);background:#fff}
.pas.ok{background:var(--lagon);color:#fff}
.pas.coffre{border-color:#E0A030;font-size:1.2rem}.pas.coffre.ok{background:#FFE7A8}
.trait-ch{width:22px;height:4px;background:#C7DADD;border-radius:2px}
.chprog{margin:0 0 6px;font-size:.95rem}
.lagon{position:relative;height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(#7FD3E0,#2BB3A8 55%,#178C86);margin:12px 0;border:3px solid var(--ocean)}
.bete{position:absolute;font-size:2.6rem;animation:nage 4s ease-in-out infinite alternate}
@keyframes nage{from{transform:translate(0,0)}to{transform:translate(14px,-10px)}}
.sable{position:absolute;left:0;right:0;bottom:0;height:38px;background:#F2D896;display:flex;align-items:center;gap:2px;padding:0 10px;overflow:hidden;font-size:1rem}
.lvide{position:absolute;inset:30% 10% auto;text-align:center;font-weight:800;color:#fff;font-size:1.1rem}
.prochain{display:flex;gap:12px;align-items:center;background:#FFF7E2;border-radius:14px;padding:10px 14px}
.prochain>div{flex:1}.prochain p{margin:0 0 6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bdg{border:2px dashed #C7DADD;border-radius:12px;padding:8px;text-align:center;opacity:.55}
.bdg.oui{border-style:solid;border-color:#E0A030;background:#FFF7E2;opacity:1}
.bdg span{font-size:1.8rem;display:block}
.recomp{display:grid;gap:8px}
.rc{display:flex;gap:10px;align-items:center;border:2px solid #C7DADD;border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.rc span{flex:1;min-width:150px}
@media (prefers-reduced-motion:reduce){.bete,.confettis span,.fcarte{animation:none}.confettis{display:none}}
.apercu{background:#E6EEF8;border-radius:12px;padding:8px 12px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.apercu span{flex:1;min-width:200px}
.semnav{display:flex;gap:6px;flex-wrap:wrap}
.semact{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.sresume{margin:10px 0;line-height:1.5}
.semaine{display:grid;gap:10px}
.srow{display:flex;gap:12px;border:2px solid #C7DADD;border-radius:12px;padding:10px 12px;background:#fff}
.srow.auj{border-color:var(--corail);box-shadow:0 0 0 3px #FFD8CF}
.srow.t-off{background:#F6F2E6;border-style:dashed}
.srow.t-ecole{background:#EAF2FB;border-style:dashed;border-color:#9DBBDF}
.srow.passe{background:#F7FAFA}
.sjour{width:92px;flex:none}
.sjour b{display:block;font-size:1.05rem}
.sjour small{opacity:.8}
.scorps{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ssel{display:flex;gap:6px;flex-wrap:wrap}
.ssel select,.jopts select{font:inherit;padding:5px 6px;border:2px solid #C7DADD;border-radius:8px;background:#fff;color:var(--ocean)}
.snot{margin:0;line-height:1.45}
.smin{margin:0;font-size:.85rem;opacity:.8}
.sstat{font-size:.88rem;font-weight:700;color:#7A6A3A}
.sstat.ok{color:var(--palme)}
.import{display:inline-flex;align-items:center;cursor:pointer;font-weight:800}
#resTxt{width:100%;font:inherit;font-size:.85rem;border:2px solid #C7DADD;border-radius:8px;padding:6px}
.intro input{font:inherit;padding:5px 8px;border:2px solid #C7DADD;border-radius:8px}
/* Barre compacte */
.barre{padding:6px 8px}
.ligne1{display:flex;gap:6px;align-items:stretch}
.barre .onglets{flex:1;display:flex;gap:4px;margin:0;min-width:0}
.barre .onglets button{flex:1;min-width:0;max-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;font-size:.74rem;line-height:1.15;background:#1C5F74;color:#fff;border:2px solid #4E8E9E;box-shadow:none;border-radius:10px}
.barre .onglets button .oi{font-size:1.15rem;line-height:1.2}
.barre .onglets button[aria-selected="true"]{background:#fff;color:var(--ocean);border-color:#fff}
.ico{background:#1C5F74;box-shadow:none;border:2px solid #4E8E9E;padding:4px 12px;font-size:1.2rem;border-radius:10px}
.ico[aria-expanded="true"]{background:#fff;color:var(--ocean)}
#menuPlus{margin-top:6px}
#barreFiches{margin-top:6px}
#barreFiches .groupe{margin-bottom:5px}
#barreFiches .groupe button{padding:6px 6px;font-size:.82rem}
#barreFiches .actions button{padding:7px 10px;font-size:.85rem}
.montrer{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:6;background:var(--ocean);box-shadow:0 2px 8px rgba(0,0,0,.25);padding:8px 13px;font-size:1.1rem}
/* Notions à travailler */
.nresume{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:8px 0}
.nresume>div{background:#F7FAFA;border:2px solid #D6E4E6;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.nsec{margin:20px 0 2px}
.nliste{display:grid;gap:8px}
.ncarte{border:2px solid #C7DADD;border-left-width:7px;border-radius:12px;padding:8px 12px;background:#fff;min-width:0}
.ncarte.s-ret{border-left-color:#C0392B}.ncarte.s-cours{border-left-color:#E0A030}.ncarte.s-nv{border-left-color:#B9CED2}.ncarte.s-acq{border-left-color:var(--palme)}
.ncarte p{margin:3px 0}
.nt{font-size:1.05rem}
.nh{font-size:.92rem;line-height:1.45}
.nact{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.nact button{font-size:.85rem;padding:7px 10px}
.ncarte .panneau{margin-top:8px}
.jatt{background:#FFF7E2;border:2px solid #E0A030;border-radius:12px;padding:8px 12px;margin:10px 0}
.jatt h3{margin:0 0 6px}
.jrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed #E8D9A8}
.jrow:first-of-type{border-top:none}
.mini{display:flex;gap:4px;flex-wrap:wrap}
[data-filtre][aria-pressed="true"]{background:var(--ocean);color:#fff;box-shadow:none}
.nrepli{margin-top:16px;border:2px solid #D6E4E6;border-radius:12px;padding:6px 12px;background:#fff}
.nrepli summary{cursor:pointer;padding:4px 0}
.nrepli .nsec{margin:0;font-weight:800;font-size:1.1rem}
.ncompact{display:grid;gap:4px;margin:4px 0 6px}

<script>
/* ================= OUTILS ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pickN=(a,k)=>shuffle(a).slice(0,k);
function uniq(k,gen){const m=new Map();let g=0;while(m.size<k&&g++<3000){const v=gen();const key=JSON.stringify(v);if(!m.has(key))m.set(key,v);}return [...m.values()];}
function distincts(gens){const s=new Set();return gens.map(g=>{let v,t=0;do{v=g();}while(s.has(v)&&t++<300);s.add(v);return v;});}
const E=(titre,items,o={})=>({titre,items,cls:o.cls||"",note:o.note,aide:o.aide,texte:o.texte,parent:o.parent});
const NOMS=["Hina","Teiki","Moana","Vaea","Tehani","Manu","Heiva","Tama"];
const pl=(n,s,p)=>n+" "+(n>1?(p||s+"s"):s);
const pts=(n,c="●")=>`<span class="pts">${Array.from({length:Math.ceil(n/5)},(_,i)=>c.repeat(Math.min(5,n-5*i))).join(" ")}</span>`;
const pieces=n=>'<span class="piece">1€</span>'.repeat(n);
const op=(a,o,b)=>({q:`${a} ${o} ${b} =`,r:o==="+"?a+b:a-b});
const cmp=(a,b)=>a<b?"&lt;":a>b?"&gt;":"=";

/* Nombres en lettres */
let TRAD=false;
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
const D={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
function l99(n){
  if(n<17)return U[n];
  if(n<20)return "dix-"+U[n-10];
  const d=Math.floor(n/10),u=n%10;
  if(d<7){if(u===0)return D[d];if(u===1)return D[d]+" et un";return D[d]+"-"+U[u];}
  if(d===7){if(n===71)return "soixante et onze";return "soixante-"+l99(n-60);}
  if(n===80)return "quatre-vingts";
  return "quatre-vingt-"+l99(n-80);
}
function lettres(n){
  let s;
  if(n<100)s=l99(n);
  else{const c=Math.floor(n/100),r=n%100;const b=c===1?"cent":U[c]+" cent";s=r===0?(c>1?b+"s":b):b+" "+l99(r);}
  return TRAD?s:s.replace(/ /g,"-");
}

/* Petits dessins */
function horloge(h,m){
  const pt=(a,r)=>[50+r*Math.sin(a*Math.PI/180),50-r*Math.cos(a*Math.PI/180)].map(v=>v.toFixed(1));
  let s=`<svg class="horloge" viewBox="0 0 100 100" width="96" height="96" role="img" aria-label="horloge"><circle cx="50" cy="50" r="46" fill="#fff" stroke="currentColor" stroke-width="3"/>`;
  for(let i=1;i<=12;i++){const [x,y]=pt(i*30,35);s+=`<text x="${x}" y="${y}" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="currentColor">${i}</text>`;}
  for(let i=0;i<60;i++){const [x1,y1]=pt(i*6,i%5?44:41),[x2,y2]=pt(i*6,46);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="${i%5?0.8:2}"/>`;}
  const [hx,hy]=pt(((h%12)+m/60)*30,21),[mx,my]=pt(m*6,34);
  return s+`<line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#B5402C" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="currentColor"/></svg>`;
}
const frac=(k,n)=>`<span class="frac"><span>${k}</span><span>${n}</span></span>`;
const bande=(k,n)=>`<span class="bande">${'<i class="on"></i>'.repeat(k)}${"<i></i>".repeat(n-k)}</span>`;
const FN={2:["demi","demis"],3:["tiers","tiers"],4:["quart","quarts"],5:["cinquième"],6:["sixième"],7:["septième"],8:["huitième"],9:["neuvième"],10:["dixième"]};
const fracNom=(k,n)=>(k===1?"un":U[k])+" "+(k===1?FN[n][0]:(FN[n][1]||FN[n][0]+"s"));

/* ================= MATHS ================= */
function addSans(){const ad=R(1,7),bd=R(1,8-ad),au=R(0,8),bu=R(0,9-au);return [ad*10+au,"+",bd*10+bu];}
function addAvec(max){let a,b;do{a=R(15,Math.floor(max*0.65));b=R(15,Math.floor(max*0.35));}while((a%10+b%10)<10||a+b>max);return [a,"+",b];}
function subSans(){for(;;){const a=R(150,599),d=[...String(a)].map(Number);const b=R(0,d[0])*100+R(0,d[1])*10+R(0,d[2]);if(b>=11&&b<=a-20)return [a,"−",b];}}
function subAvec(){let a,b;do{a=R(200,980);b=R(18,a-40);}while(b%10<=a%10);return [a,"−",b];}
const opItems=gens=>uniq(gens.length,(()=>{let i=0;return ()=>gens[i++%gens.length]();})()).map(([a,o,b])=>op(a,o,b));
const suite=(s,p)=>({q:`${s} → ${s+p} →`,r:`${s+2*p} → ${s+3*p} → ${s+4*p}`,suite:true});
const ranger=nums=>({q:shuffle(nums).join(" – "),r:[...nums].sort((a,b)=>a-b).join(" &lt; "),long:true});

M.Lettres={

function cmpCentaines(enc){
  const c=R(1,8),d=R(0,9),u=R(0,9);let d2=u===d?(d+1)%10:u;
  const a=c*100+d*10+u,b=c*100+d2*10+d;
  const x=R(1,9)*100+R(0,99),y=R(1,9)*100+R(0,99);
  const cc=R(1,9),dd=R(1,9);
  const items=[{q:`${a} … ${b}`,r:cmp(a,b)},{q:`${x} … ${y===x?y+1:y}`,r:cmp(x,y===x?y+1:y)},{q:`${cc*100+dd*10} … ${pl(cc,"centaine")} et ${pl(dd,"dizaine")}`,r:"="}];
  let n;do{n=R(101,989);}while(n%10===0);
  items.push(enc==="c"?{q:`… &lt; ${n} &lt; … <small>(à la centaine)</small>`,r:`${Math.floor(n/100)*100} &lt; ${n} &lt; ${Math.floor(n/100)*100+100}`}:{q:`… &lt; ${n} &lt; … <small>(à la dizaine)</small>`,r:`${Math.floor(n/10)*10} &lt; ${n} &lt; ${Math.floor(n/10)*10+10}`});
  const base=R(2,8)*100;items.push(ranger(uniq(4,()=>base+pick([R(0,99),R(100,150),R(1,9)*10+R(0,9)]))));
  return items;
}

   const dd=R(2,8);return E("Compare avec &lt;, &gt; ou = · range",[{q:`${a} … ${b}`,r:cmp(a,b)},{q:`${x} … ${y}`,r:cmp(x,y)},{q:`${t*10} + ${k} … ${t*10+k}`,r:"="},ranger(uniq(5,()=>pick([dd*10+R(0,9),R(1,9)*10+dd,R(11,99)])))],{aide:"Le nombre qui a le plus de dizaines est le plus grand."});},
 0:()=>{const p=uniq(3,()=>{const a=R(1,50);let b;do{b=R(1,50);}while(b===a);return [a,b];});return E("Compare avec &lt;, &gt; ou =",[...p.map(([a,b])=>({q:`${a} … ${b}`,r:cmp(a,b)})),ranger(uniq(3,()=>R(0,30)))],{aide:"&lt; et &gt; : la pointe montre le plus petit nombre."});},
 [-1]:()=>E("Écris le plus grand",uniq(4,()=>{const a=R(0,20);let b;do{b=R(0,20);}while(b===a);return [a,b];}).map(([a,b])=>({q:`${a} ou ${b} :`,r:Math.max(a,b)})),{cls:"c2",aide:"Le plus grand est celui qu'on dit en dernier quand on compte."}),
 [-2]:()=>E("Où y a-t-il le plus de points ?",uniq(3,()=>{const a=R(1,10);let b;do{b=R(1,10);}while(b===a);return [a,b];}).map(([a,b])=>({q:`A : ${pts(a)} &nbsp;&nbsp; B : ${pts(b)}`,r:a>b?"A":"B"})),{note:"Elle peut répondre en montrant du doigt."})
};
M.Complete={

 0:()=>{const a=uniq(2,()=>R(10,29)),b=uniq(2,()=>R(11,30));return E("Le nombre juste après, juste avant",[...a.map(n=>({q:`Juste après ${n} :`,r:n+1})),...b.map(n=>({q:`Juste avant ${n} :`,r:n-1}))],{cls:"c2"});},

function grille(n,marks,shape,labels){
  const s=26,o=labels?20:4,W=o+n*s+4;
  let g=`<svg class="grille" viewBox="0 0 ${W} ${W}" width="${W}" height="${W}" role="img" aria-label="quadrillage">`;
  for(let i=0;i<=n;i++)g+=`<line x1="${o+i*s}" y1="${o}" x2="${o+i*s}" y2="${o+n*s}" stroke="#7FA9B0"/><line x1="${o}" y1="${o+i*s}" x2="${o+n*s}" y2="${o+i*s}" stroke="#7FA9B0"/>`;
  if(labels)for(let i=0;i<n;i++)g+=`<text x="${o+i*s+s/2}" y="14" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">${LET[i]}</text><text x="9" y="${o+i*s+s/2+4}" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">${i+1}</text>`;
  (marks||[]).forEach(m=>g+=`<text x="${o+m.c*s+s/2}" y="${o+m.r*s+s/2+6}" font-size="17" text-anchor="middle">${m.t}</text>`);
  if(shape)g+=`<polyline points="${shape.map(([x,y])=>`${o+x*s},${o+y*s}`).join(" ")}" fill="none" stroke="#B5402C" stroke-width="3" stroke-linejoin="round"/>`;
  return g+"</svg>";
}

function niveauDepart(key,base,m=matiere){
  const def=niveauA(key,base,m);if(!REG.adapt)return {lvl:def,adapte:false};
  const h=hist(m,key).filter(x=>norm(x.r)!=="f");if(!h.length)return {lvl:def,adapte:false};
  const d=h[h.length-1],r=norm(d.r),ref=niveauA(key,Math.min(d.lvl,base),m);let l=ref;
  const monte=()=>{if(ref<base){const u=plusHaut(key,ref,base,m);if(u!==null)l=u;}};

  return {lvl:l,adapte:l!==def};
}
function conseilNotion(m,k,base){

const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"],MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MAJ=s=>s[0].toUpperCase()+s.slice(1);

/* Choix des notions de la semaine : besoins d'abord, puis le programme dans l'ordre */
function besoin(m,k,i){const h=hist(m,k).filter(x=>norm(x.r)!=="f");if(!h.length)return 2-i*.01;const d=h[h.length-1],r=norm(d.r),age=(Date.now()-d.t)/864e5;return {a0:4,a1:3,a2:2.5}[r]||Math.min(1.8,.3+age/10);}
function ordreNotions(m,exclure){const e=m==="maths"?"Calcul":"Son";return FICHES[m][niveau].filter(k=>k!==e&&k!=="Fluence"&&!exclure.has(m+":"+k)).map((k,i)=>[k,besoin(m,k,i)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);}
function choisirRev(used){
  let rev=null,pire=-1;
  for(const m of ["maths","fr"])for(const k of FICHES[m][niveau]){if(used.has(m+":"+k)||k==="Fluence")continue;const h=hist(m,k).filter(x=>norm(x.r)!=="f");if(!h.length)continue;const sc={a0:4,a1:3,a2:1,a3:0}[norm(h[h.length-1].r)];if(sc>pire){pire=sc;rev={m,key:k};}}
  if(!rev||pire<1){const k=FICHES.maths[niveau].find(k=>!used.has("maths:"+k)&&!hist("maths",k).length)||FICHES.maths[niveau].find(k=>!used.has("maths:"+k));rev={m:"maths",key:k};}
  return rev;
}
function programmerSemaine(lun){
  const wk=dateCle(lun),a=auj(),toutes=datesSemaine(lun);
  const jours=toutes.filter(c=>c>=a&&jourMaison(c));
  const res={niveau,jours:{}},deja=new Set();
  const avant=STORE.sem[wk];
  if(avant)toutes.filter(c=>c<a&&avant.jours[c]).forEach(c=>{res.jours[c]=avant.jours[c];});
  jours.filter(c=>STORE.plans[c]).forEach(c=>{const p=STORE.plans[c];res.jours[c]={fr:p.fr[1].key,maths:p.maths[1].key,rev:p.rev?{m:p.rev.m,key:p.rev.key}:null};deja.add("fr:"+p.fr[1].key);deja.add("maths:"+p.maths[1].key);});
  const libres=jours.filter(c=>!STORE.plans[c]);
  const oF=ordreNotions("fr",deja),oM=ordreNotions("maths",deja);
  libres.forEach((c,i)=>{res.jours[c]={fr:oF[i%oF.length],maths:oM[i%oM.length],rev:null};});
  const ordre=toutes.filter(c=>res.jours[c]&&c>=a);
  ordre.forEach((c,i)=>{if(typeJour(c)!=="complet"||STORE.plans[c])return;
    const avantJ=Object.keys(res.jours).filter(x=>x<c).sort();const src=avantJ[avantJ.length-2]||null;
    if(src){const m=i%2?"fr":"maths";res.jours[c].rev={m,key:res.jours[src][m],espace:true};}
    else res.jours[c].rev=choisirRev(new Set(["fr:"+res.jours[c].fr,"maths:"+res.jours[c].maths]));});
  STORE.sem[wk]=res;sauver();return res;
}
const affectation=c=>{const s=STORE.sem[cleSem(c)];return s&&s.jours[c];};
function apercuPlan(c){
  if(STORE.plans[c])return STORE.plans[c];
  if(!jourMaison(c))return null;
  const as=affectation(c);
  const fr=planSeance("fr",niveau,as&&as.fr),ma=planSeance("maths",niveau,as&&as.maths);
  let rev=null;if(typeJour(c)==="complet"){rev=as&&as.rev?as.rev:choisirRev(new Set([...fr,...ma].map(x=>x.m+":"+x.key)));rev={...rev,lvl:niveauDepart(rev.key,niveau,rev.m).lvl,etape:"Révision",min:10};}
  return {niveau,fr,maths:ma,rev,apercu:true};
}

/* Blocs d'une journée selon son type */
function blocsDuJour0(c,plan){

    h+=`<div class="srow t-${t} ${c===a?"auj":""} ${passe?"passe":""}"><div class="sjour"><b>${MAJ(JOURS[d.getDay()])}</b><small>${jourCourt(c)}${c===a?" · aujourd'hui":""}</small></div><div class="scorps">

    </div></div>`;});
  h+=`</div>`;
  if(sem){const used=new Set();Object.values(sem.jours).forEach(x=>{used.add("fr:"+x.fr);used.add("maths:"+x.maths);});

    const rf=reste("fr"),rm=reste("maths");
    if(rf.length||rm.length)h+=`<p class="note">Pas de séance principale cette semaine (ce sera pour la suivante) : ${[...rm,...rf].join(", ")}. Le calcul mental, les sons et la lecture à voix haute reviennent tous les jours en échauffement et en fin de séance.</p>`;}

  document.getElementById("semainev").innerHTML=h;
}

/* Résumé, export et import des progrès */
const LIB={a3:"seule, facilement",a2:"seule, en cherchant",a1:"avec aide",a0:"difficile",f:"fatigue"};
function resumeTexte(){
  const d=new Date(),p=REG.prenom||"l'enfant";
  const sem=SUIVI.seances.filter(s=>Date.now()-s.t<7*864e5),dates=datesSemaine(lundiDe(d)),trav=dates.filter(c=>jourMaison(c));
  let t=`Progrès de ${p} (École à la maison), résumé du ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}\nNiveau de travail : ${nomNiveau(niveau)}\n`;
  t+=`Séances : ${sem.length} sur les 7 derniers jours (${sem.reduce((a,s)=>a+s.min,0)} min), ${SUIVI.seances.length} en tout.\n`;
  t+=`Semaine en cours : ${trav.length} jours d'école à la maison prévus (${trav.map(c=>JOURS[jourDe(c).getDay()]+" "+typeJour(c)).join(", ")}).\n`;
  t+=`Échelle : ⭐⭐⭐ seule facilement, ⭐⭐ seule en cherchant, ⭐ avec aide, ✋ difficile, 😴 fatigue. 🎮 = bilan donné après un jeu en ligne (logicieleducatif.fr).\n`;
  for(const m of ["maths","fr"]){t+=`\n${m==="maths"?"MATHS":"FRANÇAIS"} (bilans du plus ancien au plus récent ; niveau du dernier ; conseil)\n`;
    const ks=Object.keys(NOMK[m]).filter(k=>hist(m,k).length);
    if(!ks.length)t+="- pas encore de bilan\n";
    ks.forEach(k=>{const h=hist(m,k),l=h[h.length-1];t+=`- ${NOMK[m][k]} [${STAT[statutNotion(m,k)][0]}] : ${h.slice(-6).map(x=>(x.src==="jeu"?"🎮":"")+emo(x.r)).join(" ")} ; ${NOM_NIV[l.lvl]} ; ${conseilNotion(m,k,niveau)||""} (${h.length} bilan${h.length>1?"s":""}, dernier le ${new Date(l.t).getDate()}/${new Date(l.t).getMonth()+1})\n`;});
    const jamais=FICHES[m][niveau].filter(k=>!hist(m,k).length).map(k=>NOMK[m][k]);if(jamais.length)t+=`Jamais travaillé à ce niveau : ${jamais.join(", ")}\n`;}
  const f=SUIVI.flu.slice(-10);t+=`\nLecture à voix haute (mots en 1 min) : ${f.length?f.map(x=>`${new Date(x.t).getDate()}/${new Date(x.t).getMonth()+1} : ${x.score}`).join(" ; "):"pas encore de score"}\n`;
  const jx=(SUIVI.jeux||[]).filter(x=>x.r).slice(-12);t+=`\nJeux en ligne évalués : ${jx.length?jx.map(x=>`${x.titre}${x.m&&x.k&&NOMK[x.m][x.k]?" ("+NOMK[x.m][x.k]+")":""} ${emo(x.r)} le ${new Date(x.t).getDate()}/${new Date(x.t).getMonth()+1}`).join(" ; "):"aucun"}\n`;
  const J=STORE.jeu||{};t+=`Récompenses : ${J.total||0} coquillages gagnés, badges : ${Object.keys(J.badges||{}).length}\n`;
  return t;
}
async function exporterProgres(){
  const data=JSON.stringify({app:"ecole-a-la-maison",version:1,exporte:new Date().toISOString(),store:STORE});
  const nom=`progres-${(REG.prenom||"enfant").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"")}-${auj()}.json`;
  if(ENV_ART){const dl=await window.claude.use("downloads");if(!dl){toast("L'export n'est pas disponible ici. Utilise « Copier le résumé ».");return;}
    try{await dl.save({filename:nom,data});}catch(e){if(e&&e.code!=="cancelled")toast("Le fichier n'a pas pu être enregistré.");}return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=nom;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast("📤 Fichier enregistré dans tes téléchargements. Tu peux l'envoyer dans la conversation avec Claude, ou l'importer sur un autre appareil.");

function brancherExport(){
  document.getElementById("impHist").onclick=()=>{const v=+document.getElementById("impPer").value;document.getElementById("boite").close();imprimerHistorique(v);};
  document.getElementById("copierRes").onclick=async()=>{const t=resumeTexte(),z=document.getElementById("resTxt");z.value=t;
    try{await navigator.clipboard.writeText(t);toast("📋 Résumé copié. Colle-le dans la conversation avec Claude et demande : « Analyse ses progrès ».");}
    catch(e){z.hidden=false;z.focus();z.select();toast("Sélectionne le texte affiché, copie-le, puis colle-le dans la conversation avec Claude.");}};
  document.getElementById("exporter").onclick=exporterProgres;
  document.getElementById("importer").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let o;try{o=JSON.parse(r.result);}catch(e){o=null;}const z=document.getElementById("zImp");
      if(!o||o.app!=="ecole-a-la-maison"||!o.store){z.textContent="Ce fichier n'est pas un fichier de progrès de l'application.";return;}
      const dt=new Date(o.exporte);z.innerHTML=`Fichier du ${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()} : ${(o.store.suivi&&o.store.suivi.seances||[]).length} séances. Remplacer les progrès de cet appareil ? <button id="impOui" class="o-btn">Oui, remplacer</button> <button id="impNon" class="o-btn cache">Annuler</button>`;
      document.getElementById("impNon").onclick=()=>{z.innerHTML="";};
      document.getElementById("impOui").onclick=()=>{const s=o.store;s.maj=Date.now();adopter(s);sauver();document.getElementById("boite").close();toast("📥 Progrès importés.");};};
    r.readAsText(f);};
}

function prochaineSurprise(){const s=SEUILS.find(x=>x>J_().total);return s?`Encore <b>${s-J_().total} 🐚</b> avant la prochaine surprise ❓`:"Ton lagon est complet ! Continue à gagner des coquillages pour tes récompenses.";}

function donnerBadge(id,liste){const J=J_();if(J.badges[id])return;J.badges[id]=auj();const b=BADGES.find(x=>x[0]===id);if(b)liste.push(b);}
function verifierBadges(liste){
  const J=J_();
  if(J.nbEx>=10)donnerBadge("perse",liste);
  const notions=Object.keys(SUIVI.res).filter(k=>SUIVI.res[k].length).length;if(notions>=5)donnerBadge("explo",liste);
  if((SUIVI.res["fr:Ecrire"]||[]).length>=5)donnerBadge("ecrivaine",liste);
  const n=J.serie.n;if(n>=3)donnerBadge("s3",liste);if(n>=5)donnerBadge("s5",liste);if(n>=10)donnerBadge("s10",liste);

function gagner(n,raison,badges){
  const J=J_(),avant=J.total;J.coq+=n;J.total+=n;
  const nouv=SEUILS.map((s,i)=>avant<s&&J.total>=s?ANIMAUX[i]:null).filter(Boolean);
  const bs=badges||[];verifierBadges(bs);sauver();majCompteur();fete(n,raison,nouv,bs);
}
function fete(n,msg,nouv,badges){
  const f=document.getElementById("fete");

  f.innerHTML=`<div class="confettis" aria-hidden="true">${confettis}</div><div class="fcarte" role="dialog" aria-label="Bravo">
    <div class="fbig">+${n} 🐚</div><p class="fmsg">${msg}</p>
    ${nouv.map(([e,nom])=>`<div class="fnouv"><span class="fanim">${e}</span><b>Une nouvelle amie arrive dans ton lagon : ${nom} !</b></div>`).join("")}
    ${badges.map(([,e,nom])=>`<div class="fnouv"><span class="fanim">${e}</span><b>Nouveau badge : ${nom}</b></div>`).join("")}
    <p class="fprog">${prochaineSurprise()}</p>
    <div class="fact">${onglet==="fiches"&&etat.some((s,i)=>!s.res&&!document.getElementById("exo"+i).hidden)?`<button id="feteSuite">➡ Exercice suivant</button>`:""}<button id="feteLagon" class="o-btn">🐚 Voir mon lagon</button><button id="feteOk" class="o-btn cache">Fermer</button></div></div>`;
  f.hidden=false;bip();
  const fermer=()=>{f.hidden=true;};
  document.getElementById("feteOk").onclick=fermer;
  document.getElementById("feteLagon").onclick=()=>{fermer();setOnglet("lagon");};
  const s=document.getElementById("feteSuite");if(s)s.onclick=()=>{fermer();const j=etat.findIndex((x,i)=>!x.res&&!document.getElementById("exo"+i).hidden);if(j>=0){document.getElementById("exo"+j).scrollIntoView({behavior:"smooth",block:"start"});SES.clic={i:j,t:Date.now()};}};

function renderLagon(){

  const s=SEUILS.find(x=>x>J.total),prev=SEUILS[n-1]||0,pc=s?Math.round((J.total-prev)/(s-prev)*100):100;

  h+=`<div class="prochain"><span class="fanim">❓</span><div><p>${prochaineSurprise()}</p><span class="sprog large"><i style="width:${pc}%"></i></span></div></div>`;
  h+=`<h3>Mes badges</h3><div class="badges">${BADGES.map(([id,e,t])=>`<div class="bdg ${J.badges[id]?"oui":""}"><span>${J.badges[id]?e:"🔒"}</span><small>${t}</small></div>`).join("")}</div>`;
  h+=`<h3>Échanger mes coquillages</h3><p class="note">Les animaux du lagon restent pour toujours. Les coquillages se dépensent pour de vraies récompenses, avec l'accord d'un adulte.</p><div class="recomp">${REG.recomp.map(([r,p],i)=>`<div class="rc"><span>${r}</span><b>${p} 🐚</b><button class="o-btn" data-ech="${i}" ${J.coq<p?"disabled":""}>${J.coq<p?`encore ${p-J.coq}`:"Échanger"}</button></div>`).join("")}</div><p id="zEch"></p>`;
  h+=`<p class="note">👤 <b>Pour le parent</b> : les coquillages récompensent l'effort, pas la vitesse ni les réussites seules. Ils arrivent quand tu notes un exercice, à la fin d'une séance, et au bilan de la journée. Tu peux changer les récompenses et le prénom dans 👤 Guide du parent → Réglages.</p>`;

function enregistrerSerie(){const J=J_(),a=auj();if(J.serie.last===a)return;
  const x=jourDe(a);let prev=null;for(let k=0;k<14;k++){x.setDate(x.getDate()-1);const c=dateCle(x);if(jourMaison(c)){prev=c;break;}}
  J.serie.n=J.serie.last===prev?J.serie.n+1:1;J.serie.last=a;}
function verifSemaine(bs){
  const J=J_(),lun=lundiDe(new Date()),wk=dateCle(lun),js=datesSemaine(lun).filter(c=>jourMaison(c));
  if(!js.length||(J.semaines&&J.semaines[wk]))return false;
  const faits=new Set(SUIVI.seances.map(s=>dateCle(new Date(s.t))));
  if(!js.every(c=>faits.has(c)))return false;
  J.semaines=J.semaines||{};J.semaines[wk]=1;donnerBadge("semaine",bs);return true;}

SUIVI.jeux=SUIVI.jeux||[];
function clicJeu(a,ev){
  const e={id:"j"+Date.now().toString(36),t:Date.now(),m:a.dataset.m||"",k:a.dataset.k||"",l:+(a.dataset.l||1),titre:a.textContent.trim(),url:a.href,r:null};
  SUIVI.jeux.push(e);SUIVI.jeux=SUIVI.jeux.slice(-80);STORE.jeuEnCours=e.id;sauver();
}
const jeuParId=id=>SUIVI.jeux.find(x=>x.id===id);
function evaluerJeu(id,r){
  const e=jeuParId(id);if(!e)return;
  if(STORE.jeuEnCours===id)STORE.jeuEnCours=null;
  if(r==="x"){SUIVI.jeux=SUIVI.jeux.filter(x=>x.id!==id);sauver();if(onglet==="notions")renderNotions();return;}
  const deja=!!e.r;e.r=r;e.te=Date.now();
  if(e.m&&e.k&&G[e.m]&&G[e.m][e.k])noter(e.m,e.k,e.l,r,"jeu");else sauver();
  if(onglet==="notions")renderNotions();
  if(!deja)gagner(2,r==="f"?"Merci de l'avoir dit. On se repose !":"🎮 Bravo pour ce jeu en ligne !");
}
function demanderEval(id){
  const e=jeuParId(id);if(!e||e.r)return;
  const notion=e.m&&e.k&&NOMK[e.m][e.k]?` <small>(${NOMK[e.m][e.k]})</small>`:"";
  toast(`🎮 Comment s'est passé le jeu « ${e.titre} »${notion} ? Ça aide à savoir ce qu'il reste à travailler.`,
    [...ECH.map(([r,ic,t])=>[`${ic} ${t}`,()=>evaluerJeu(id,r)]),["Pas joué",()=>evaluerJeu(id,"x")]]);
}
function verifRetourJeu(){const id=STORE.jeuEnCours;if(!id)return;const e=jeuParId(id);if(!e||e.r){STORE.jeuEnCours=null;return;}
  const age=Date.now()-e.t;if(age<15000||age>6*3600e3)return;STORE.jeuEnCours=null;sauver();demanderEval(id);}

/* ================= NOTIONS À TRAVAILLER ================= */
const STAT={ret:["À retravailler","🔴","Elle a eu du mal la dernière fois : on reprend plus simple, avec des objets."],cours:["En cours","🟠","Ça s'installe : on continue au même niveau, un peu chaque jour."],nv:["Pas encore vue","⚪","À découvrir : commencez par une séance courte et facile."],acq:["Acquise","🟢","Réussie seule à son niveau : un rappel de temps en temps suffit."]};
const ORDRE_S=["ret","cours","nv","acq"];
function statutNotion(m,k){
  const h=hist(m,k).filter(x=>norm(x.r)!=="f");if(!h.length)return "nv";
  const d=h[h.length-1],p=h[h.length-2],r=norm(d.r),ok=x=>x&&["a2","a3"].includes(norm(x.r))&&x.lvl>=niveau;
  if(r==="a0")return "ret";
  if(r==="a1"&&p&&["a0","a1"].includes(norm(p.r)))return "ret";
  if((r==="a3"&&d.lvl>=niveau)||(ok(d)&&ok(p)))return "acq";
  return "cours";
}
let FILTRE_N="tout";
function renderNotions(){
  const ms=FILTRE_N==="tout"?["maths","fr"]:[FILTRE_N];
  let h=`<div class="entete"><h2>🎯 Notions à travailler${chipEnfant()}</h2><div class="champs semnav">${[["tout","Tout"],["maths","🔢 Maths"],["fr","📖 Français"]].map(([v,t])=>`<button class="o-btn" data-filtre="${v}" aria-pressed="${FILTRE_N===v}">${t}</button>`).join("")}<button class="o-btn" data-imphist="1">🖨 Imprimer l'historique</button></div></div>`;
  h+=`<p class="sresume">Niveau ${nomNiveau(niveau)} · d'après les bilans des exercices, de l'écriture sur papier et des jeux en ligne (🎮).</p>`;
  h+=`<div class="nresume">${["maths","fr"].map(m=>{const ks=FICHES[m][niveau],c={ret:0,cours:0,nv:0,acq:0};ks.forEach(k=>c[statutNotion(m,k)]++);
    return `<div><b>${m==="maths"?"🔢 Maths":"📖 Français"}</b> · ${c.acq} / ${ks.length} acquises<span class="sprog large"><i style="width:${c.acq/ks.length*100}%"></i></span><small>🔴 ${c.ret} à retravailler · 🟠 ${c.cours} en cours · ⚪ ${c.nv} pas encore vues</small></div>`;}).join("")}</div>`;
  const att=SUIVI.jeux.filter(x=>!x.r&&Date.now()-x.t<7*864e5).slice(-6).reverse();
  if(att.length)h+=`<div class="jatt"><h3>🎮 Jeux à évaluer</h3>${att.map(e=>`<div class="jrow"><span><b>${e.titre}</b>${e.m&&e.k&&NOMK[e.m][e.k]?` <small>(${NOMK[e.m][e.k]}, ${new Date(e.t).getDate()}/${new Date(e.t).getMonth()+1})</small>`:""}</span><span class="mini">${ECH.map(([r,ic,t])=>`<button class="o-btn res" data-evj="${e.id}" data-r="${r}" title="${t}">${ic}</button>`).join("")}<button class="o-btn cache" data-evj="${e.id}" data-r="x">Pas joué</button></span></div>`).join("")}</div>`;
  const lignes=[];ms.forEach(m=>FICHES[m][niveau].forEach(k=>{const s=statutNotion(m,k),hh=hist(m,k);lignes.push({m,k,s,t:hh.length?hh[hh.length-1].t:0});}));
  ORDRE_S.forEach(s=>{const L=lignes.filter(x=>x.s===s).sort((a,b)=>s==="acq"?b.t-a.t:a.t-b.t);if(!L.length)return;
    if(s==="nv"||s==="acq"){
      h+=`<details class="nrepli"><summary><span class="nsec">${STAT[s][1]} ${STAT[s][0]} <small>(${L.length})</small></span></summary><p class="mat">${STAT[s][2]}</p><div class="ncompact">${L.map(({m,k})=>{const lvl=niveauDepart(k,niveau,m).lvl,hh=hist(m,k);return `<div class="nrow"><span>${m==="maths"?"🔢":"📖"} <b>${NOMK[m][k]}</b>${hh.length?` <small>${hh.slice(-3).map(x=>(x.src==="jeu"?"🎮":"")+emo(x.r)).join(" ")}</small>`:""}</span><button class="o-btn" data-entr="${m}|${k}">▶ ${NOM_NIV[lvl].replace("CE1 · ","")}</button></div>`;}).join("")}</div></details>`;
      return;}
    h+=`<h3 class="nsec">${STAT[s][1]} ${STAT[s][0]} <small>(${L.length})</small></h3><p class="mat">${STAT[s][2]}</p><div class="nliste">`;
    L.forEach(({m,k})=>{const i=m+"-"+k,hh=hist(m,k),lvl=niveauDepart(k,niveau,m).lvl,jeu=JEUX[m][k]?JEUX[m][k](lvl):"",web=panneauLiens(k,lvl,m),cs=conseilNotion(m,k,niveau);
      h+=`<div class="ncarte s-${s}"><p class="nt"><span>${m==="maths"?"🔢":"📖"}</span> <b>${NOMK[m][k]}</b></p>
        <p class="nh">${hh.length?`Derniers bilans : ${hh.slice(-6).map(x=>(x.src==="jeu"?"🎮":"")+emo(x.r)).join(" ")}`:"Pas encore de bilan"}${cs?` · ${cs}`:""}</p>
        <p class="mat">Prochain exercice : ${NOM_NIV[lvl]}</p>
        <div class="nact"><button data-entr="${m}|${k}">▶ S'entraîner (6 min)</button>${web?`<button class="o-btn" data-p="nweb-${i}" aria-expanded="false">🌐 Jeux en ligne</button>`:""}${jeu?`<button class="o-btn" data-p="njeu-${i}" aria-expanded="false">🎲 Idée de jeu</button>`:""}${GUIDE[m]&&GUIDE[m][k]?`<button class="o-btn aide" data-p="naide-${i}" aria-expanded="false">👤 Comment l'aider</button>`:""}</div>
        ${web?`<div class="panneau web" id="nweb-${i}" hidden>${web}</div>`:""}${jeu?`<div class="panneau" id="njeu-${i}" hidden>${jeu}</div>`:""}${GUIDE[m]&&GUIDE[m][k]?`<div class="panneau guide" id="naide-${i}" hidden>${matiere===m?guideHtml(k):(()=>{const s0=matiere;matiere=m;const g=guideHtml(k);matiere=s0;return g;})()}</div>`:""}
      </div>`;});
    h+=`</div>`;});
  h+=`<p class="note">Une notion est <b>acquise</b> quand elle a été réussie seule à son niveau (⭐⭐⭐, ou ⭐⭐ deux fois de suite). Après un jeu en ligne, l'application te demande comment ça s'est passé : cette note compte comme un bilan de la notion.</p>`;
  document.getElementById("notionsv").innerHTML=h;
}
document.getElementById("notionsv").addEventListener("click",ev=>{
  const a=ev.target.closest("a.lien");if(a){clicJeu(a,ev);return;}

});

/* Fusion de deux sauvegardes : rien ne se perd si les deux appareils ont servi */
function fusion(a,b){
  if(!a||!a.suivi)return b;if(!b||!b.suivi)return a;
  const rec=(a.maj||0)>=(b.maj||0)?a:b,anc=rec===a?b:a;
  const r=JSON.parse(JSON.stringify(rec));
  const uni=(x,y,cle,lim)=>{const m=new Map();[...(y||[]),...(x||[])].forEach(e=>{const k=cle(e);const p=m.get(k);if(!p||(!p.r&&e.r))m.set(k,e);});return [...m.values()].sort((u,v)=>(u.t||0)-(v.t||0)).slice(-lim);};
  r.suivi=r.suivi||{res:{},flu:[],seances:[]};
  const res=r.suivi.res||(r.suivi.res={});
  for(const k of new Set([...Object.keys(a.suivi.res||{}),...Object.keys(b.suivi.res||{})]))res[k]=uni(a.suivi.res&&a.suivi.res[k],b.suivi.res&&b.suivi.res[k],e=>e.t+"|"+e.r,20);
  r.suivi.flu=uni(a.suivi.flu,b.suivi.flu,e=>e.t,60);
  r.suivi.seances=uni(a.suivi.seances,b.suivi.seances,e=>e.t,200);
  r.suivi.jeux=uni(a.suivi.jeux,b.suivi.jeux,e=>e.id,80);
  r.jours=r.jours||{};
  for(const [d,j] of Object.entries(anc.jours||{})){const x=r.jours[d]||(r.jours[d]={fait:{},notes:{}});x.fait=Object.assign({},j.fait||{},x.fait||{});for(const k in (j.fait||{}))if(j.fait[k])x.fait[k]=true;x.notes=Object.assign({},j.notes||{},x.notes||{});if(j.bilanGagne)x.bilanGagne=true;}
  for(const o of ["plans","sem","ov"]){r[o]=Object.assign({},anc[o]||{},r[o]||{});}
  const ja=a.jeu||{},jb=b.jeu||{};
  if(ja.total!==undefined||jb.total!==undefined){
    const top=(ja.total||0)>=(jb.total||0)?ja:jb;r.jeu=JSON.parse(JSON.stringify(Object.assign({},rec.jeu||{},{coq:top.coq,total:top.total,nbEx:Math.max(ja.nbEx||0,jb.nbEx||0)})));
    r.jeu.badges=Object.assign({},jb.badges||{},ja.badges||{});
    r.jeu.semaines=Object.assign({},jb.semaines||{},ja.semaines||{});
    r.jeu.echanges=uni(ja.echanges,jb.echanges,e=>e.t+"|"+e.r,100);
    const sa=ja.serie||{},sb=jb.serie||{};r.jeu.serie=(sa.last||"")>=(sb.last||"")?sa:sb;}
  r.reg=r.reg||{};if(!r.reg.prenom&&anc.reg&&anc.reg.prenom)r.reg.prenom=anc.reg.prenom;
  r.intro=!!(a.intro||b.intro);
  r.maj=Math.max(a.maj||0,b.maj||0);
  return r;
}
const memes=(x,y)=>JSON.stringify(x)===JSON.stringify(y);

async function syncLire(f){
  const r=await fetch(syncUrl(f)+"?t="+Date.now(),{headers:syncHdr(),cache:"no-store"});
  if(r.status===404)return {data:null,sha:null};
  if(r.status===401||r.status===403)throw new Error("acces");
  if(!r.ok)throw new Error("http"+r.status);
  const j=await r.json();let data=null;try{data=JSON.parse(b64d(j.content||""));}catch(e){data=null;}
  return {data,sha:j.sha};
}
async function syncEcrire(f,objet,sha){
  const corps={message:"Mise à jour du "+new Date().toLocaleString("fr-FR"),content:b64e(JSON.stringify(objet))};
  if(sha)corps.sha=sha;
  const r=await fetch(syncUrl(f),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},syncHdr()),body:JSON.stringify(corps)});
  if(r.status===409||r.status===422)return null;
  if(r.status===401||r.status===403)throw new Error("acces");
  if(!r.ok)throw new Error("http"+r.status);
  return (await r.json()).content.sha;
}
async function syncListe(){
  for(let essai=0;essai<3;essai++){
    const {data,sha}=await syncLire("profils");
    const loc={liste:PROFILS.liste,suppr:PROFILS.suppr,maj:PROFILS.maj||0};
    const fus=data?fusionProfils(loc,data):loc;
    if(!memes(fus.liste,PROFILS.liste)||!memes(fus.suppr,PROFILS.suppr)){PROFILS.liste=fus.liste;PROFILS.suppr=fus.suppr;PROFILS.maj=fus.maj;sauverProfils();majEnfants();}
    if(data&&memes(fus.liste,data.liste)&&memes(fus.suppr,data.suppr))return;
    if(await syncEcrire("profils",{liste:fus.liste,suppr:fus.suppr,maj:fus.maj},sha))return;
  }
}
async function synchroniser(){
  if(!syncActif())return;
  if(syncEnCours){syncRelance=true;return;}
  syncEnCours=true;syncEtat("🔄 Synchronisation…",false);
  try{
    await syncListe();
    const f=fichierProfil(PROFILS.actif);
    for(let essai=0;essai<3;essai++){
      const {data,sha}=await syncLire(f);
      const dist=data&&data.store?data.store:data;
      const local=JSON.parse(JSON.stringify(STORE));
      const neuf=!SYNC.vus||!SYNC.vus[f];
      const fus=dist?fusion(neuf?Object.assign({},local,{maj:0}):local,dist):local;
      if(neuf&&dist)fus.maj=Math.max(local.maj||0,dist.maj||0);
      if(!memes(fus,local)){const sauf=REG.barreCachee;adopter(fus);REG.barreCachee=sauf;}
      if(dist&&memes(fus,dist)){syncSha=sha;break;}
      const nouv=await syncEcrire(f,{app:"ecole-a-la-maison",version:1,store:JSON.parse(JSON.stringify(STORE))},sha);
      if(nouv){syncSha=nouv;break;}
    }
    SYNC.vus=SYNC.vus||{};SYNC.vus[f]=1;
    syncEtat("☁️ Progrès synchronisés entre tes appareils · "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),true);
  }catch(e){
    syncEtat(e.message==="acces"?"⚠️ Synchronisation refusée : vérifie le jeton (☰ → Synchronisation)":(navigator.onLine===false?"📴 Hors ligne : la synchronisation reprendra avec internet":"⚠️ Synchronisation impossible pour l'instant, nouvel essai bientôt"),false);
  }
  syncEnCours=false;
  if(syncRelance){syncRelance=false;setTimeout(synchroniser,1500);}
}

function fusionProfils(a,b){
  const suppr=[...new Set([...(a.suppr||[]),...(b.suppr||[])])].sort();
  const rec=(a.maj||0)>=(b.maj||0)?a:b,anc=rec===a?b:a,m=new Map();
  [...(anc.liste||[]),...(rec.liste||[])].forEach(p=>m.set(p.id,{id:p.id,prenom:p.prenom||""}));
  let liste=[...m.values()].filter(p=>!suppr.includes(p.id));
  if(!liste.length)liste=[{id:PROFILS.actif,prenom:REG.prenom||""}];
  return {liste,suppr,maj:Math.max(a.maj||0,b.maj||0)};
}

async function imprimerContenu(titre,html,paysage,fichier){
  const page=`@page{size:A4 ${paysage?"landscape":"portrait"};margin:10mm}`;
  if(ENV_ART){
    const dl=await window.claude.use("downloads");

/* ---------- Programme de la semaine ---------- */
function htmlSemaine(lun,detail){
  const dates=datesSemaine(lun),sem=STORE.sem[dateCle(lun)],a=auj();
  const cols=dates.filter((c,i)=>i<5||jourMaison(c));
  const d0=jourDe(dates[0]),d6=jourDe(dates[6]);
  const periode=d0.getMonth()===d6.getMonth()?`du ${d0.getDate()} au ${d6.getDate()} ${MOIS[d6.getMonth()]} ${d6.getFullYear()}`:`du ${d0.getDate()} ${MOIS[d0.getMonth()]} au ${d6.getDate()} ${MOIS[d6.getMonth()]} ${d6.getFullYear()}`;
  const vide=(c,p)=>`<td class="off">${typeJour(c)==="ecole"?(p?"🏫 À l'école":""):(p?"—":"")}</td>`;
  const cell=(c,f,p)=>!jourMaison(c)?vide(c,p):`<td>${f(c)||(c<a?"<span class='gris'>—</span>":"<span class='gris'>choisi le jour même</span>")}</td>`;
  const faitsDu=(c,m)=>{const l=[];for(const [id,hh] of Object.entries(SUIVI.res)){const [mm,k]=id.split(":");if(mm===m&&hh.some(x=>dateCle(new Date(x.t))===c))l.push(NOMK[m][k]||k);}return l;};
  const as=c=>sem&&sem.jours[c];
  const notionCell=(c,m)=>{if(c<a){const f=faitsDu(c,m);if(f.length)return "✔ "+f.join(", ");}return as(c)?NOMK[m][as(c)[m]]:"";};
  const blocs=c=>!jourMaison(c)?[]:journeeDe(c,STORE.plans[c]||apercuPlan(c));
  const trouve=(c,id)=>blocs(c).find(b=>b.id===id);
  let h=`<header class="imphead"><h1>Programme de la semaine${prenomActif()?` · ${esc(prenomActif())}`:""}</h1><p>${MAJ(periode)} · niveau ${nomNiveau(niveau)}</p></header>`;
  h+=`<table class="impsem"><thead><tr><th></th>${cols.map(c=>`<th>${dLongue(c)}<br><small>${!jourMaison(c)?(typeJour(c)==="ecole"?"À l'école":"Repos"):TYPES[typeJour(c)].replace(/^\S+\s/,"")+" · "+hmin(enMin(debutJour(c)))}</small></th>`).join("")}</tr></thead><tbody>`;
  h+=`<tr><th>📖 Français</th>${cols.map(c=>cell(c,x=>notionCell(x,"fr"),true)).join("")}</tr>`;

/* ================= CARNET DE BORD (justificatif d'instruction) ================= */
const DOMAINES={rit:"Rituels (date, calendrier, calcul mental oral)",fr:"Français (lecture, écriture, étude de la langue)",maths:"Mathématiques",monde:"Questionner le monde",arts:"Arts plastiques et éducation musicale",eps:"Éducation physique et sportive",lv:"Langue vivante (anglais)",emc:"Langage oral, enseignement moral et civique",autre:"Autres activités"};
function domaineBloc(b){if(b.dom)return b.dom;return {rituel:"rit",fr:"fr",maths:"maths",lecture:"fr",ecrit:"fr",offerte:"fr",monde:"monde",art:"arts",sport:"eps",anglais:"lv",jeu:"maths",cuisine:"maths",bilan:"emc",revision:(b.items&&b.items[0]&&b.items[0].m)||"maths"}[b.id]||"autre";}
function journaliser(c,id,on){
  const j=jourEtat(c);j.log=j.log||{};
  if(!on){delete j.log[id];return;}
  const pl=STORE.plans[c]||apercuPlan(c),b=(!jourMaison(c)?[]:journeeDe(c,pl)).find(x=>x.id===id);
  if(b)j.log[id]={lib:(b.ico?b.ico+" ":"")+b.t.replace(/<[^>]+>/g,""),d:b.d,dom:domaineBloc(b),h:b.debut,det:b.items?b.items.map(it=>`${it.etape} : ${NOMK[it.m][it.key]} (${NOM_NIV[it.lvl]})`).join(" · "):b.jm?`Compétences : ${jmParId(b.jm).comp}.`:(b.x||"").replace(/<[^>]+>/g,"")};
  if(b&&b.jm)j.log[id].jm=b.jm;
}
function logDuJour(c){
  const j=STORE.jours[c];if(!j)return [];
  const out=[];
  for(const [id,ok] of Object.entries(j.fait||{})){if(!ok)continue;
    let e=j.log&&j.log[id];
    if(!e&&jourMaison(c)){const b=journeeDe(c,STORE.plans[c]||apercuPlan(c)).find(x=>x.id===id);if(b)e={lib:(b.ico?b.ico+" ":"")+b.t,d:b.d,dom:domaineBloc(b),h:b.debut,det:"",jm:b.jm};}
    if(e)out.push({id,...e});}
  return out.sort((a,b)=>(a.h||0)-(b.h||0));
}
function joursPeriode(deb,fin){const out=[];const x=jourDe(deb),f=jourDe(fin);while(x<=f){out.push(dateCle(x));x.setDate(x.getDate()+1);}return out;}

const jmParId=id=>JEUX_MAISON.find(g=>g.id===id);
function scoreJeu(g){const w={ret:3,cours:2,nv:.6,acq:.3};
  return g.n.reduce((s,[m,k])=>s+(FICHES[m][niveau].includes(k)?w[statutNotion(m,k)]:.5),0)/Math.sqrt(g.n.length);}
function notionCible(g){const o={ret:0,cours:1,nv:2,acq:3};
  const l=g.n.filter(([m,k])=>FICHES[m][niveau].includes(k)).map(([m,k])=>({m,k,s:statutNotion(m,k)})).sort((a,b)=>o[a.s]-o[b.s]);
  return l[0]&&(l[0].s==="ret"||l[0].s==="cours")?l[0]:null;}
function jmTries(){return [...JEUX_MAISON].sort((a,b)=>scoreJeu(b)-scoreJeu(a));}
function jeuPourJour(c){
  const j=STORE.jours[c];if(j&&j.jm&&jmParId(j.jm)&&jmTries().some(g=>g.id===j.jm))return jmParId(j.jm);
  const tri=jmTries().slice(0,4),g=tri[Math.round(jourDe(c)/864e5)%tri.length];
  if(c===auj())jourEtat(c).jm=g.id;
  return g;
}
function autreJeu(c){const tri=jmTries(),i=tri.findIndex(g=>g.id===jeuPourJour(c).id);jourEtat(c).jm=tri[(i+1)%tri.length].id;sauver();renderJournee();}
function texteJeu(g){const nc=notionCible(g);
  return `${nc?`🎯 Tombe bien : « ${NOMK[nc.m][nc.k]} » est ${nc.s==="ret"?"à retravailler":"en cours"}. `:""}Elle y travaille : ${g.comp}. ${nc&&g.t&&g.t[nc.m+":"+nc.k]?MAJ(g.t[nc.m+":"+nc.k]):g.comment}`;}
function blocJeu(c,d){const g=jeuPourJour(c);
  return {id:"jeu",d:Math.max(d,g.min),ico:"🎲",t:"Jeu de société : "+g.nom,x:texteJeu(g)+` <button class="o-btn lienjm" data-jmfiche="${g.id}">ℹ️ Pourquoi ce jeu</button>`,cat:"jm",dom:g.dom,jm:g.id};}

function blocsDuJour(c,plan){
  const bl=blocsDuJour0(c,plan),j=STORE.jours[c]||{};if(!bl.length)return bl;
  let out=bl.map(b=>{let x=b;
    const s=j.subst&&j.subst[b.id];
    if(s){x={...x,t:s.t,x:s.x,ico:s.ico||x.ico,dom:s.dom||domaineBloc(x)};delete x.seance;delete x.items;delete x.cat;delete x.note;}
    if(j.court&&j.court[b.id]){
      if(x.items&&x.items.length>1){const it=x.items.find(i=>i.etape==="Notion du jour")||x.items[0];x={...x,items:[{...it,min:Math.max(4,Math.round(it.min*.7))}]};x.d=x.items[0].min;}
      else x={...x,d:Math.max(5,Math.round(x.d/2))};
      x.t+=" (version courte)";}
    return x;});
  out=appliquerOrdre(out,j.ordreM||(REG.ordreType&&REG.ordreType[typeJour(c)]));
  (j.ordre||[]).forEach(id=>{const i=out.findIndex(b=>b.id===id);if(i<0)return;const k=prochaineAct(out,i);if(k>0){const t=out[i];out[i]=out[k];out[k]=t;}});
  return out;
}
function prochaineAct(l,i){for(let k=i+1;k<l.length;k++){if(l[k].ancre)return -1;if(!l[k].pause)return k;}return -1;}

/* ================= DÉPLACER LES ACTIVITÉS : APPUI LONG PUIS GLISSER ================= */
function appliquerOrdre(out,ord){
  if(!ord||!ord.length)return out;
  const pos=new Map(ord.map((id,i)=>[id,i]));let last=-1;
  return out.map((b,i)=>{let k;if(pos.has(b.id)){k=pos.get(b.id);last=k;}else k=last+.5+i*1e-3;return {b,k};}).sort((x,y)=>x.k-y.k).map(x=>x.b);
}
let DP=null,DND=null,DND_TOUCH=0;
const jz=document.getElementById("journee");
function dndPreparer(cible,x,y){
  if(cible.closest("button,input,label,select,textarea,a,summary"))return;
  const el=cible.closest(".bloc[data-dep]");if(!el)return;
  dndAnnulerPrep();DP={el,x,y,t:setTimeout(()=>dndCommencer(),450)};
}
function dndAnnulerPrep(){if(DP){clearTimeout(DP.t);DP=null;}}
function dndCommencer(){
  const el=DP.el,r=el.getBoundingClientRect();
  try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
  const clone=el.cloneNode(true);clone.classList.add("dnd-clone");clone.removeAttribute("data-bloc");
  Object.assign(clone.style,{width:r.width+"px",left:r.left+"px",top:r.top+"px"});document.body.appendChild(clone);
  const ligne=document.createElement("div");ligne.className="dnd-ligne";
  el.classList.add("dnd-source");el.parentNode.insertBefore(ligne,el);
  DND={el,id:el.dataset.bloc,clone,ligne,dy:-18,x:DP.x,y:DP.y,avant:[...jz.querySelectorAll(".jour .bloc[data-bloc]")].map(e=>e.dataset.bloc)};
  window.DND_ACTIF=true;DP=null;document.body.classList.add("dnd-on");
  dndPlacer();DND.raf=requestAnimationFrame(dndDefil);
}
function dndPlacer(){
  const {y,clone,ligne,el}=DND;clone.style.top=(y-DND.dy)+"px";
  const L=[...jz.querySelectorAll(".jour .bloc[data-bloc]")].filter(e=>e!==el);
  const apres=L.find(e=>{const r=e.getBoundingClientRect();return y<r.top+r.height/2;});
  if(apres){if(ligne.nextSibling!==apres)apres.parentNode.insertBefore(ligne,apres);}
  else if(L.length){const d=L[L.length-1];if(d.nextSibling!==ligne)d.parentNode.insertBefore(ligne,d.nextSibling);}
  const h=apres?apres.querySelector(".heure").childNodes[0].textContent.trim():"";
  ligne.textContent=h?`Déposer ici · vers ${h}`:"Déposer ici · en fin de journée";
}
function dndDefil(){if(!DND)return;const m=70,v=DND.y<m?-14:DND.y>innerHeight-m?14:0;if(v){window.scrollBy(0,v);dndPlacer();}DND.raf=requestAnimationFrame(dndDefil);}
function dndFin(deposer){
  if(!DND)return;const d=DND;DND=null;window.DND_ACTIF=false;cancelAnimationFrame(d.raf);document.body.classList.remove("dnd-on");

/* ================= NOTE INSUFFISANTE (✋) : L'EXERCICE SUIVANT DESCEND D'UN NIVEAU ================= */
function baisserSuivant(i){
  for(let j=i+1;j<etat.length;j++){
    const s=etat[j],sec=document.getElementById("exo"+j);if(!s||s.res||!sec||sec.hidden)continue;
    const b=plusBas(s.key,s.lvl);
    if(b===null){toast("✋ Noté. L'exercice suivant est déjà au niveau le plus simple : fais-le avec elle, avec des objets.");return;}
    s.lvl=b;s.e=G[matiere][s.key][b]();s.adapte=true;rendreExo(j);
    sec.classList.add("baisse");setTimeout(()=>sec.classList.remove("baisse"),2500);
    setTimeout(()=>toast(`🪜 C'était difficile : l'exercice suivant (« ${s.e.titre} ») passe au niveau ${NOM_NIV[b]}. On finit sur une réussite.`),400);
    return;
  }
}

STORE.flash=STORE.flash||{};
const MOTS_OUTILS_CE1=["et","est","un","une","le","la","les","des","dans","avec","pour","sur","mais","ou","il","elle","ils","elles","je","tu","nous","vous","sont","ont","à","de","du","en","qui","que","très","aussi","beaucoup","toujours","jamais","puis","alors","après","avant","quand","comme","chez","sous","sans","bien","encore","déjà","trop","plus","moins"];
function paquetsFlash(){
  const n=niveau,c=[];
  const add=(id,q,r,type)=>c.push({id,q,r,type:type||"nb"});
  for(let a=1;a<=9;a++)for(let b=1;b<=10-a;b++)add(`+${a}+${b}`,`${a} + ${b}`,a+b);
  if(n>=-1)for(let a=1;a<=9;a++)add(`c10-${a}`,`${a} + … = 10`,10-a);
  if(n>=-1)for(let a=1;a<=10;a++)add(`d${a}`,`Double de ${a}`,2*a);
  if(n>=0){for(let a=2;a<=9;a++)for(let b=Math.max(2,11-a);b<=9;b++)add(`+${a}+${b}`,`${a} + ${b}`,a+b);for(let a=1;a<=10;a++)add(`m${2*a}`,`Moitié de ${2*a}`,a);}
  if(n>=1){for(const a of [13,24,37,45,52,68,71,86])add(`p10-${a}`,`${a} + 10`,a+10);for(const a of [23,35,48,56,64,79,90])add(`s10-${a}`,`${a} − 10`,a-10);
    for(let a=11;a<=18;a++)for(const b of [3,4,5,6,7])if(a-b>=1&&a-b<10)add(`-${a}-${b}`,`${a} − ${b}`,a-b);}
  if(n>=2)for(const t of [2,5,10])for(let b=1;b<=10;b++)add(`x${t}x${b}`,`${t} × ${b}`,t*b);
  if(n>=3)for(const t of [3,4])for(let b=1;b<=10;b++)add(`x${t}x${b}`,`${t} × ${b}`,t*b);
  const mots=n<=-1?(CP_PROG.filter(p=>p.niv<=n+1).flatMap(p=>p.motsOutils)):n===0?CP_PROG.flatMap(p=>p.motsOutils):MOTS_OUTILS_CE1;
  [...new Set(mots)].forEach(m=>add(`mo-${m}`,m,m,"mot"));
  return c;
}
const ATTENTE=[0,0,1,3,7,14];
function seanceFlash(){
  const c=auj(),P=paquetsFlash(),F=STORE.flash,dues=P.filter(x=>F[x.id]&&F[x.id].next<=c).sort((a,b)=>F[a.id].b-F[b.id].b);
  const nouv=shuffle(P.filter(x=>!F[x.id]));const calc=nouv.filter(x=>x.type==="nb"),mots=nouv.filter(x=>x.type==="mot");
  let l=[...dues.slice(0,8)];while(l.length<12&&(calc.length||mots.length)){if(calc.length)l.push(calc.shift());if(l.length<12&&mots.length&&(l.length%3===2||!calc.length))l.push(mots.shift());}
  return shuffle(l).slice(0,12);
}

/* ================= BILAN DES BLOCAGES SUR 14 JOURS : QUAND, SUR QUOI, QUE FAIRE ================= */
function evenementsBlocage(jours){
  const t0=Date.now()-jours*864e5,ev=[];
  for(const [id,h] of Object.entries(SUIVI.res)){const [m,k]=id.split(":");h.forEach(x=>{const r=norm(x.r);if(x.t>=t0&&(r==="a0"||r==="f"))ev.push({t:x.t,type:r==="f"?"fatigue":"difficile",dom:k==="Ecrire"?"écriture":m==="maths"?"maths":"français",quoi:NOMK[m][k]||k});});}
  for(const [c,j] of Object.entries(STORE.jours))(j.chg||[]).forEach(x=>{if(x.t>=t0){const id=x.id,dom=["fr","lecture","ecrit","offerte"].includes(id)?(id==="ecrit"?"écriture":"français"):["maths","cuisine"].includes(id)?"maths":id==="revision"?"révision":"autres activités";ev.push({t:x.t,type:"opposition",dom,quoi:x.de});}});
  return ev.sort((a,b)=>a.t-b.t);
}
function analyseBlocages(){
  const ev=evenementsBlocage(14),n=ev.length;
  if(n<3)return {n,html:`<p>🌿 <b>Peu de blocages ces deux dernières semaines</b> (${n}). Continue comme ça : séances courtes, réussites au début et à la fin.</p>`};
  const pc=(f)=>Math.round(ev.filter(f).length/n*100);
  const aprem=pc(e=>new Date(e.t).getHours()>=12),matin=100-aprem;
  const doms={};ev.forEach(e=>doms[e.dom]=(doms[e.dom]||0)+1);const [domMax,domN]=Object.entries(doms).sort((a,b)=>b[1]-a[1])[0];
  const jsem={};ev.forEach(e=>{const w=new Date(e.t).getDay();jsem[w]=(jsem[w]||0)+1;});const [wMax,wN]=Object.entries(jsem).sort((a,b)=>b[1]-a[1])[0];
  const r7=ev.filter(e=>e.t>=Date.now()-7*864e5).length,p7=n-r7;
  const types={difficile:0,fatigue:0,opposition:0};ev.forEach(e=>types[e.type]++);
  const pistes=[];
  if(aprem>=60)pistes.push(`<b>Surtout l'après-midi (${aprem} %)</b> : mets les notions difficiles le matin (appui long sur l'activité pour la déplacer) et garde l'après-midi pour les jeux, les arts et le sport.`);
  else if(matin>=70)pistes.push(`<b>Surtout le matin (${matin} %)</b> : démarre en douceur avec un rituel en mouvement et les cartes flash, puis un exercice qu'elle réussit avant la notion difficile.`);
  if(domN/n>=.5)pistes.push(`<b>Surtout en ${domMax} (${Math.round(domN/n*100)} %)</b> : séances plus courtes (« ✂️ Version courte »), passage par les objets et vos jeux de société, et un niveau plus simple si ça coince.`);
  if(wN>=3&&wN/n>=.4)pistes.push(`<b>Souvent le ${JOURS[wMax]}</b> : prévois une journée plus légère ce jour-là (« ⏱ Courte (1 h) » dans la semaine).`);
  if(types.fatigue>=3)pistes.push(`<b>De la fatigue (${types.fatigue} fois)</b> : vérifie le coucher et raccourcis les journées pendant quelque temps. La fatigue rend tout plus difficile.`);
  if(types.opposition>=types.difficile+types.fatigue&&types.opposition>=3)pistes.push(`<b>Plutôt de l'opposition que de la difficulté</b> : laisse-la choisir l'ordre des activités et propose toujours deux options. Évite les « encore un » : annonce la fin à l'avance.`);
  const tend=r7>p7+1?`📈 Plus de blocages cette semaine (${r7}) que la précédente (${p7}) : allège un peu, plus de jeux, et dis-lui ce qu'elle réussit.`:r7<p7-1?`📉 Moins de blocages cette semaine (${r7}) que la précédente (${p7}) : ce que tu fais fonctionne, dis-le-lui !`:`Stable : ${r7} cette semaine, ${p7} la précédente.`;
  if(!pistes.length)pistes.push("Pas de moment ni de matière qui ressort : c'est plutôt ponctuel. Garde les séances courtes et les choix entre deux activités.");
  return {n,html:`<p>${n} signaux en 14 jours : ${types.difficile} trop difficile${types.difficile>1?"s":""} (✋), ${types.fatigue} fatigue (😴), ${types.opposition} changement${types.opposition>1?"s":""} d'activité.</p><p>${tend}</p><ul>${pistes.map(x=>`<li>${x}</li>`).join("")}</ul>`};
}

    <p>Des comètes tombent sur les igloos des pingouins : on les arrête en tapant le bon résultat (pavé à l'écran ou clavier, puis « Entrée »). Logiciel libre, sans publicité.</p>

}

   "452 = 400 + 50 + 2\n452 = 4 centaines, 5 dizaines, 2 unités\n1 centaine = 10 dizaines",

   [["400 + 50 + 2 devient 4 + 5 + 2.","Lire chaque morceau à voix haute : « quatre-cents »."],["Elle ne voit pas les 45 dizaines.","Faire l'échange réel avec les billets."]])],
 Calcul:[
  L(CP,"Calcul mental : ajouter et retirer jusqu'à 20","Ajouter et retirer de petits nombres de tête ; connaître par cœur les doubles et les amis du 10.","Compter jusqu'à 20, les amis du 10.","Coquillages, deux boîtes de 10, un dé.",
   [["🤲 Partir du grand nombre","« J'ai 5 coquillages, j'en ajoute 3. » Elle part de 5 (sans recompter depuis 1 !) et avance : 6, 7, 8. Pour retirer, on enlève et on regarde ce qui reste."],
    ["✏️ Passer par 10","Avec les boîtes de 10 : 8 + 5 → on remplit d'abord la première boîte (8 + 2), il en reste 3 pour la deuxième : 10 + 3 = 13."],
    ["📝 Les doubles","1+1, 2+2… 5+5 (les doigts des deux mains), 6+6 (la boîte d'œufs). Puis elle écrit : 8 + 5 = 8 + 2 + 3 = 13."],
    ["🎯 Seule","Le furet : tu donnes un calcul, elle répond, puis elle t'en donne un. Peu de calculs, mais justes et rapides."]],
   "Je pars du plus grand nombre et j'avance.\nLes doubles : 2+2=4, 3+3=6, 4+4=8, 5+5=10.\n8 + 5 : je passe par 10 → 8 + 2 + 3 = 13.",
   "Calcul simple (6 + 2) : si elle recompte depuis 1 sur ses doigts, elle n'a pas encore le réflexe « je pars de 6 ».",
   [["Elle recompte tout depuis 1.","Cache le premier tas sous le gobelet : « il y en a 5 là-dessous, continue »."],["Elle compte le nombre de départ (5 + 3 → « 5, 6, 7 »).","« On est sur 5. On fait 3 sauts : 6, 7, 8. »"]]),
  L(CE1,"Calcul mental : les bonnes astuces","Calculer de tête des additions et soustractions jusqu'à 100 en choisissant une astuce : passer par la dizaine, +9 = +10 − 1, doubles et moitiés.","Amis du 10, doubles jusqu'à 10, ajouter 10.","Billets 10/1, une droite numérique vide, ardoise.",
   [["🤲 Avec les billets","27 + 10 : on ajoute un billet de 10 → 37. Le chiffre des dizaines avance de 1. Puis 27 + 9 : « c'est presque 10 » → 37 − 1 = 36."],
    ["✏️ Sur la droite vide","38 + 5 : un saut de 2 jusqu'à 40, puis un saut de 3 → 43. Pour 52 − 7 : on recule de 2 jusqu'à 50, puis de 5 → 45."],
    ["📝 Écrire l'astuce","Elle écrit son chemin en une ligne : 38 + 5 = 38 + 2 + 3 = 43. Doubles et moitiés : 15 + 15 = 30, la moitié de 30 = 15."],
    ["🎯 Seule","3 calculs : elle choisit son astuce et te l'explique."]],
   "+10 : le chiffre des dizaines avance de 1.\n+9 = +10 − 1.\nJe passe par la dizaine : 38 + 5 = 38 + 2 + 3 = 43.",
   "Demande « comment as-tu fait ? » : une astuce bien expliquée vaut mieux qu'un résultat juste trouvé en comptant 1 par 1.",
   [["Elle compte 1 par 1 sur ses doigts.","Revenir aux billets : on ne compte pas un billet de 10 en dix pièces."],["Erreur au passage de la dizaine (38 + 5 = 33).","Toujours compléter d'abord jusqu'à 40."]])],
 Pose:[
  L(CP,"L'addition et la soustraction : à quoi ça sert","Comprendre quand on additionne (on réunit, on ajoute) et quand on soustrait (on enlève), et écrire le calcul en ligne avec + , − et =.","Dénombrer jusqu'à 20.","Coquillages, deux assiettes, de petites histoires.",
   [["🤲 Mimer","« Il y a 4 poissons dans la barque, papa en pêche 3 de plus. » Elle joue la scène avec les coquillages. « À la fin, il y en a plus ou moins qu'au début ? » Plus : c'est +."],
    ["✏️ Dessiner","Elle dessine la scène avec des ronds (pas de beaux dessins), puis écrit 4 + 3 = 7. Même chose pour retirer : 9 poissons, on en mange 2 → 9 − 2 = 7."],
    ["📝 Le signe =","= veut dire « ça fait autant de chaque côté ». On lit à voix haute : « 4 plus 3 égale 7 »."],
    ["🎯 Seule","Tu racontes, elle écrit le calcul ; puis elle invente une histoire pour 5 + 2."]],
   "J'ajoute, je réunis : +\nJ'enlève, je retire : −\n= : il y a autant de chaque côté.",
   "Dans une histoire où l'on enlève, elle choisit − sans que tu le dises.",
   [["Elle additionne toujours.","Faire mimer : « à la fin, il y en a plus ou moins ? »"],["Elle croit que 7 = 4 + 3 est faux.","C'est juste ! = ne veut pas dire « la réponse », mais « pareil »."]]),
  L([1,2],"L'addition posée (avec retenue)","Poser une addition en colonnes et la calculer, avec retenue.","Dizaines et unités, 10 unités = 1 dizaine, les tables d'addition.","Billets 10/1 (ou paquets de coquillages), tableau D | U, papier à grands carreaux.",
   [["🤲 Manipuler","27 + 35 avec les billets. On réunit les unités : 7 + 5 = 12 pièces de 1. « On a 10 pièces : on les échange contre un billet de 10 ! » Il reste 2 unités. Puis les dizaines : 2 + 3 + le billet échangé = 6 → 62."],
    ["✏️ Dans le tableau","Même chose dans le tableau D | U : la retenue, c'est le billet échangé. On l'écrit en petit en haut de la colonne des dizaines."],
    ["📝 Poser","Les chiffres bien alignés, unités sous unités. On commence par la droite. « 7 + 5 = 12 : je pose 2 et je retiens 1. »"],
    ["🎯 Seule","2 additions sans retenue, 2 avec. Si elle doute, elle vérifie avec les billets."]],
   "Je pose les unités sous les unités.\nJe commence par les unités.\nSi j'ai 10 unités ou plus, j'échange 10 unités contre 1 dizaine : c'est la retenue.",
   "Demande-lui ce que veut dire le petit 1 de la retenue : « un paquet de 10 ».",
   [["Elle écrit 12 en bas de la colonne des unités.","Revenir à l'échange avec les billets."],["Elle oublie la retenue.","Retenue écrite en couleur, barrée quand elle a servi."],["Chiffres mal alignés.","Papier à grands carreaux : un chiffre par carreau."]]),
  L([3,3],"La soustraction posée","Poser et calculer une soustraction en colonnes, avec ou sans retenue.","Addition posée ; 1 dizaine = 10 unités.","Billets 10/1, tableau D | U.",
   [["🤲 Manipuler","52 − 27 avec les billets : il faut retirer 7 unités mais il n'y en a que 2. « On casse un billet de 10 » en 10 pièces : 12 unités, 12 − 7 = 5. Il reste 4 dizaines : 4 − 2 = 2 → 25."],
    ["✏️ Dans le tableau","Elle barre le 5 et écrit 4 au-dessus ; le 2 devient 12. C'est la méthode « par cassage », la plus facile à comprendre avec les billets."],
    ["📝 Poser","On commence toujours par les unités : « 2 − 7 ? Impossible : je casse une dizaine. »"],
    ["🎯 Seule","2 soustractions sans retenue, 2 avec. Elle vérifie avec une addition : 25 + 27 = 52."]],
   "Je commence par les unités.\nSi le chiffre du haut est trop petit, je casse une dizaine en 10 unités.\nJe vérifie avec une addition.",
   "Elle vérifie seule son résultat avec une addition : c'est le meilleur signe qu'elle a compris. (Si elle retourne à l'école, garde la méthode de sa future classe.)",
   [["Elle fait 7 − 2 au lieu de 2 − 7 (résultat 35).","On retire toujours le nombre du bas à celui du haut ; avec les billets, impossible de faire autrement."],["Elle casse la dizaine mais oublie de la retirer.","Barrer le chiffre en couleur."]])],
 Mult:[

 Fractions:[
